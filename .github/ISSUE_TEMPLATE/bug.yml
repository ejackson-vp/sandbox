name: Bug report
description: Something is broken, or an enforced guarantee does not hold
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Use
        [private vulnerability reporting](https://github.com/ejackson-vp/sandbox/security/advisories/new)
        instead.

        If a claim in `docs/security-guarantees.md` does not hold, say so
        explicitly — that is a security bug even if it looks minor.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected behaviour, actual behaviour, and whether it reproduces.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - controller
        - relay
        - guest
        - sdk
        - cli
        - deploy / manifests
        - docs
        - unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Image tag (`0.1.15`), git commit, or both.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, request bodies, or the failing demo target.
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: |
        Redact credentials, capabilities and payment signatures. Control-plane
        logs should never contain plaintext commands or file contents; if they
        do, treat it as a security issue.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This reproduces on a clean `make up` (or I have said why it cannot)
        - label: I searched existing issues
