name: publish-mcp

# Publishes `throwbox-mcp` to npm, which is what the official MCP registry
# points at. The registry itself stores metadata only, so this has to run before
# `mcp-publisher publish` and it has to be idempotent: a re-run of a tag must not
# fail because the version is already there.
#
# Separate from release.yml on purpose. A missing npm token is an npm problem,
# not a reason to withhold the images, and the images are what the cluster runs.
#
# One-time setup: add an npm automation token as the `NPM_TOKEN` secret for a
# user who can publish `throwbox-mcp`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance for the tarball, signed against this workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The published tarball is built from dist, so it has to exist before the
      # pack that publishes it. The root `build` is the server packages only:
      # the control image has no `mcp/` directory and would fail on it.
      - run: npm run build:mcp

      - name: decide whether this version still needs publishing
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./mcp/package.json').version")
          server=$(node -p "require('./mcp/server.json').version")
          if [ "$version" != "$server" ]; then
            # The registry refuses a mismatch, and it refuses it after npm has
            # already taken the tarball. Fail here, before anything is public.
            echo "::error::mcp/package.json is $version but mcp/server.json is $server"
            exit 1
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            # Not a failure: the images are the release, and a missing npm
            # credential must not turn every tag red. Say so loudly enough that
            # nobody reads the green tick as "published".
            echo "::warning::NPM_TOKEN is not set: throwbox-mcp@${version} was NOT published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### npm: skipped, no NPM_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "throwbox-mcp@${version} was not published. Add an npm automation token as the \`NPM_TOKEN\` secret and re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if npm view "throwbox-mcp@${version}" version >/dev/null 2>&1; then
            echo "throwbox-mcp@${version} is already published; nothing to do" >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### npm: throwbox-mcp@${version} already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: publish
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          npm publish -w throwbox-mcp --access public --provenance
          version=$(node -p "require('./mcp/package.json').version")
          echo "### npm: published throwbox-mcp@${version}" >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
