name: ghcr-check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Token scope per package
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          for pkg in sandbox-guest sandbox-control; do
            tok=$(curl -sS -u "$ACTOR:$TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:ejackson-vp/$pkg:pull,push" \
              | jq -r .token)
            code=$(curl -sS -o /tmp/out -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $tok" -H "Content-Length: 0" \
              "https://ghcr.io/v2/ejackson-vp/$pkg/blobs/uploads/" || true)
            echo "$pkg upload-init -> $code"
            head -c 200 /tmp/out; echo
          done
