name: ghcr-check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Token scope per package
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          for pkg in sandbox-guest sandbox-control; do
            echo "== $pkg =="
            code=$(curl -sS -o /tmp/token.json -w "%{http_code}" -u "$ACTOR:$TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:ejackson-vp/$pkg:pull,push" || true)
            echo "http=$code"
            tok=$(jq -r '.token // empty' /tmp/token.json 2>/dev/null)
            if [ -z "$tok" ]; then
              head -c 300 /tmp/token.json; echo
              continue
            fi
            python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)).get("access")))' "$tok"
          done
