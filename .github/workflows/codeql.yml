name: codeql

on:
  # Every branch, not just main. CodeQL attaches an analysis to the head commit
  # of the event that triggered it, so a multi-commit push to main leaves the
  # intermediate commits unanalysed: they were never a push head. Analysing each
  # branch push gives every commit an analysis under the ref it was pushed on,
  # which is what the OpenSSF SAST check reads (#227, #99). Do not add
  # `paths-ignore` here; it recreates the same gap for the ignored paths.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL Go needs a real build. The module root is guest/, not the repo
      # root, so autobuild does not reliably find it.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum

      - if: matrix.language == 'go'
        name: build guest
        working-directory: guest
        run: go build ./...

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
