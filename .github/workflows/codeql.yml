name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # CodeQL Go needs a real build. The module root is guest/, not the repo
      # root, so autobuild does not reliably find it.
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum

      - if: matrix.language == 'go'
        name: build guest
        working-directory: guest
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
