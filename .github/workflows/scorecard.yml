name: scorecard

# OpenSSF Scorecard scores supply-chain hygiene: pinned actions, branch
# protection, signed releases, dependency update tooling. Results land in the
# Security tab and on the public scorecard viewer.

on:
  branch_protection_rule:
  schedule:
    - cron: "31 2 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard
