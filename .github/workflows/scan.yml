name: scan

# Manual vulnerability scan for an already-published tag. The release workflow
# runs the same scanner as a gate; this one is read-only and prints the table,
# so you can inspect a failure without cutting a new release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag without the leading v (e.g. 0.1.4)
        required: true
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [control, guest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ inputs.tag }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Same parameters as the release gate, so a red release can be reproduced
      # here without cutting a tag.
      - name: Gate ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ inputs.tag }}
          format: sarif
          output: gate-${{ matrix.name }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"
