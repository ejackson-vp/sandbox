name: ci

# Every branch push used to start a `push` run *and* a `pull_request` run for
# the same commit, with nothing to deduplicate them. Coverage re-ran the
# integration suite in one of those, so a branch push drove the 62
# SIGSTOP/socket tests four times (#145). Feature branches are now covered by
# `pull_request` alone; `push` is main and tags. `workflow_call` stays for
# release.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Required so release.yml can gate image publishing on the test suite.
  workflow_call:

# One group per head branch. `github.head_ref` is only set on `pull_request`;
# `ref_name` covers main pushes, tags and dispatch.
#
# Only a pull request cancels in progress. A rapid second push to main must not
# kill the first run's `coverage-badge` job mid-publish: with `false` the new
# main run stays pending behind the running one and supersedes only a previously
# pending run. A superseded PR run is cancelled, which is the case that used to
# race two copies of the integration suite under load.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep the token read-only even though the repository default is now write
# (GHCR pushes require that default; explicit workflow permissions cap it).
permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    # Postgres 17 is the only store backend (ADR 0010). The store contract skips
    # when DATABASE_URL is unset, so an unset variable here would quietly test
    # nothing that talks to a real server. The service container is the throwaway
    # database the contract truncates between cases.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vitest strips types without checking them, so the suite is compiled
      # separately. A test that imports a symbol shared no longer exports fails
      # here instead of passing (#144).
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npm run lint:structure
      # The published profile set is guest/profiles/runtime-images.conf; the
      # release workflow builds exactly those and nothing else.
      - run: ./guest/check-profiles.sh
      # Unit and property run once, under instrumentation: the per-module floors
      # in vitest.config.ts fail the build on a regression, and this job's
      # json-summary is one of the two reports `coverage-badge` merges. Running
      # them twice (plain, then covered) measured the same files twice for no
      # extra signal.
      - run: npm run test:coverage
      # Portable suites that no other job runs. They need no cluster or guest
      # binary; the browser compatibility case skips without its image.
      - run: npm run test:portable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # The standalone `postgres contract` job is gone: `unit` now runs the same
  # suite against Postgres 17, under coverage, so a second job proved the same
  # adapters twice. `npm run test:store-contract` remains for running it alone
  # against a local container. It was never in the required-check set
  # (`unit`, `integration (local guest)`, `markdownlint`, `internal links`), so
  # removing it changes no branch protection.

  # The same contract `unit` runs under coverage, as a named required check.
  # Branch protection lists `postgres contract`, so removing the job without
  # updating protection blocks every merge. Keep it until protection changes.
  postgres-contract:
    name: postgres contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:store-contract
      # Restore drill: seed a database, copy it with CREATE DATABASE … TEMPLATE,
      # then assert the payment, ledger and in-flight session survived the copy
      # (docs/backup-restore.md). Same service container, no extra binaries.
      - run: npm run test:restore-drill

  # Short deterministic budget so PR CI stays fast. The longer soak runs are
  # documented in CONTRIBUTING.md; the nightly fault lane owns the soak.
  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      - run: npm ci
      - run: npm run build
      # One step per target, so the retry in scripts/fuzz-go.sh costs another
      # 20 s for the target that lost the engine's shutdown race instead of
      # re-running the whole matrix. Every failure other than
      # `context deadline exceeded` stays fatal (#130).
      - name: fuzz FuzzOpen (envelope)
        working-directory: guest
        run: ../scripts/fuzz-go.sh ./internal/envelope FuzzOpen 20s
      - name: fuzz FuzzResolve (files)
        working-directory: guest
        run: ../scripts/fuzz-go.sh ./internal/files FuzzResolve 20s
      - name: fuzz FuzzTransferFraming (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzTransferFraming 20s
      - name: fuzz FuzzSupervisorDecrypt (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzSupervisorDecrypt 20s
      - name: fuzz FuzzFrameDecode (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzFrameDecode 20s
      - name: fuzz FuzzChunkDecode (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzChunkDecode 20s
      - name: typescript fuzz targets
        # Instrumented so the badge can merge them. These targets drive the
        # create route, the internal payment routes and the controller client
        # with adversarial input, and no other measured suite does that.
        run: npm run test:fuzz:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-fuzz-report
          path: coverage-fuzz/
          retention-days: 14

  integration:
    name: integration (local guest)
    runs-on: ubuntu-latest
    # The integration harness opens Postgres directly and creates a database per
    # worker, so this job needs the same service as `unit`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      - run: npm ci
      - run: npm run build
      - run: make guest
      - name: go tests
        working-directory: guest
        run: go test ./...
      # go test runs only a subset of vet checks. The struct-tag check is not in
      # it, which is how two fields with the same JSON tag shipped and silently
      # dropped the field from every result.
      - name: go vet
        working-directory: guest
        run: go vet ./...
      - name: gofmt
        working-directory: guest
        run: test -z "$(gofmt -l .)"
      # The only run of this suite per push. It SIGSTOPs a real guest process
      # and uses real sockets, so a second concurrent run doubles the runner
      # load and flakes (#145, #128). Coverage must not re-run it.
      - name: integration tests
        env:
          GUEST_BINARY: ${{ github.workspace }}/guest/bin/x402-guest
        # Instrumented so the badge can merge this suite with the unit one. The
        # client and wiring code under `sdk` and `api` is only reached from here,
        # so measuring it is worth 1068 lines the unit run never touches.
        run: npm run test:integration:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-integration-report
          path: coverage-integration/
          retention-days: 14

  # The README coverage badge is measured, not hand-maintained. `unit` runs the
  # unit and property suites under instrumentation; `integration` runs the same
  # suite it always runs, instrumented; `fuzz` runs its TypeScript targets
  # instrumented. This job merges the three reports, because coverage is a union:
  # a line counts if any suite ran it. Before the merge the badge read whatever
  # the unit suite alone reached, which scored the client, wiring and adversarial
  # entry points at zero.
  #
  # The merge also owns the floor, since none of the runs can express a total
  # only the set reaches. The per-module floors in vitest.config.ts still gate
  # `unit` on every pull request; this one gates a main push.
  #
  # Writes exactly one JSON file to the `badges` branch, which the README badge
  # reads. Main pushes only, and it never checks out or runs PR code: the
  # artifacts are produced by the trusted run, this job only merges and publishes.
  coverage-badge:
    name: coverage badge
    needs: [unit, integration, fuzz]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-report
          path: coverage
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-integration-report
          path: coverage-integration
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-fuzz-report
          path: coverage-fuzz
      - name: Merge unit, integration and fuzz coverage
        # A few points under the merged totals, so a real drop fails the publish
        # instead of only recolouring a badge.
        run: >-
          node scripts/coverage-merge.mjs coverage-merged
          coverage/lcov.info coverage-integration/lcov.info coverage-fuzz/lcov.info
          --floor-lines 74 --floor-branches 64 --floor-functions 75
      - name: Render badge JSON
        run: node scripts/coverage-badge.mjs coverage-merged/coverage-summary.json badge/coverage.json
      - name: Publish to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" checkout -q -b badges
          cp badge/coverage.json "$tmp/coverage.json"
          git -C "$tmp" add coverage.json
          git -C "$tmp" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: update coverage badge [skip ci]"
          # The branch is a single-file publish target, not history: overwrite
          # it so it cannot grow one commit per main push.
          git -C "$tmp" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # The isolation claim is the third pillar of the README, and until now it was
  # only ever checked by a human with a laptop cluster. This runs the
  # packet-level suite against a real kind + Cilium cluster on a hosted runner.
  #
  # Path-scoped, because a full build takes about fifteen minutes and a docs
  # change cannot move a packet. The gate is a step inside the job rather than
  # `on.pull_request.paths`: a path-filtered workflow leaves a required check
  # sitting at "Expected" and blocks the very merge it was meant to protect.
  # This way the check always reports, in seconds when nothing relevant moved.
  #
  # The cluster is runc, not Kata. Nested virtualisation is not available on a
  # hosted runner, so the microVM half of the release gate stays in
  # `nightly-faults.yml` on the self-hosted runner.
  isolation:
    name: isolation (kind + cilium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scope gate diffs against the base branch, so the history has to
          # be there.
          fetch-depth: 0

      - name: decide whether this change can move a packet
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Third pillar paths: what runs in the sandbox, what it can dial, and
          # the policy that decides both. A dependency bump counts, because the
          # relay is a WebSocket transport.
          pattern='^(deploy/|tests/security/|guest/|Dockerfile\.control|Makefile$|package-lock\.json$|\.github/workflows/ci\.yml$|scripts/install-ci-cluster-tools\.sh$|vitest\.security\.config\.ts$|controller/src/(relay/|k8s|egress-proxy|tokens)|controller/src/config/(egress|relay|tls|kubernetes)\.ts|shared/src/(ip|capability)\.ts|shared/src/entries/(ip|crypto)\.ts)'

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            {
              echo "relevant=true"
              echo "reason=not a pull request: main pushes, dispatch and the schedule always run it"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          matched="$(printf '%s\n' "${changed}" | grep -E "${pattern}" || true)"

          if [ -n "${matched}" ]; then
            count="$(printf '%s\n' "${matched}" | wc -l | tr -d ' ')"
            {
              echo "relevant=true"
              echo "reason=${count} relevant path(s) changed: $(printf '%s' "${matched}" | head -3 | tr '\n' ' ')"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "relevant=false"
              echo "reason=no path that can change what runs in the sandbox or what it can dial"
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=isolation skipped::${count:-0} relevant paths changed"
          fi

      - name: report the scope decision
        run: |
          {
            echo "### isolation (kind + cilium)"
            echo ""
            echo "\`relevant=${{ steps.scope.outputs.relevant }}\`"
            echo ""
            echo "${{ steps.scope.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: install kind, kubectl and the Cilium CLI
        if: steps.scope.outputs.relevant == 'true'
        run: ./scripts/install-ci-cluster-tools.sh

      - if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum

      - if: steps.scope.outputs.relevant == 'true'
        run: npm ci

      - name: build the cluster and deploy from this checkout
        if: steps.scope.outputs.relevant == 'true'
        env:
          KIND_CLUSTER: x402-sandbox
        # `make up` creates kind, installs Cilium with kubeProxyReplacement off,
        # builds both images, loads them and waits for every rollout. The kind
        # config maps host 8080 to the API NodePort, so API_URL works unchanged.
        run: make up

      - name: run the packet-level isolation suite
        if: steps.scope.outputs.relevant == 'true'
        env:
          GUEST_BINARY: ${{ github.workspace }}/guest/bin/x402-guest
          KIND_CLUSTER: x402-sandbox
          API_URL: http://localhost:8080
        run: mkdir -p artifacts/security && npm run test:security -- --reporter=default --reporter=junit --outputFile.junit=artifacts/security/junit.xml

      - name: dump the cluster state
        if: failure() && steps.scope.outputs.relevant == 'true'
        run: |
          set +e
          mkdir -p artifacts/security
          {
            kubectl get nodes -o wide
            kubectl -n sandbox-system get pods -o wide
            kubectl -n sandbox-system describe pods
            kubectl -n sandbox-system get networkpolicy -o yaml
            kubectl -n kube-system logs -l k8s-app=cilium --tail=200
          } > artifacts/security/cluster-state.txt 2>&1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && steps.scope.outputs.relevant == 'true'
        with:
          name: isolation-cluster-state
          path: artifacts/security/
          retention-days: 14

  # Cluster-backed tests (network isolation, warm pool, checkpoint portability)
  # that need a Kata runtime are intentionally run locally or on the fault
  # runner: nested virtualisation is not available on a hosted runner.
  #   make up && make security-isolation
