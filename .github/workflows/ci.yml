name: ci

# Every branch push used to start a `push` run *and* a `pull_request` run for
# the same commit, with nothing to deduplicate them. Coverage re-ran the
# integration suite in one of those, so a branch push drove the 62
# SIGSTOP/socket tests four times (#145). Feature branches are now covered by
# `pull_request` alone; `push` is main and tags. `workflow_call` stays for
# release.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Required so release.yml can gate image publishing on the test suite.
  workflow_call:

# One group per head branch. `github.head_ref` is only set on `pull_request`;
# `ref_name` covers main pushes, tags and dispatch.
#
# Only a pull request cancels in progress. A rapid second push to main must not
# kill the first run's `coverage-badge` job mid-publish: with `false` the new
# main run stays pending behind the running one and supersedes only a previously
# pending run. A superseded PR run is cancelled, which is the case that used to
# race two copies of the integration suite under load.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep the token read-only even though the repository default is now write
# (GHCR pushes require that default; explicit workflow permissions cap it).
permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    # Postgres 17 is the only store backend (ADR 0010). The store contract skips
    # when DATABASE_URL is unset, so an unset variable here would quietly test
    # nothing that talks to a real server. The service container is the throwaway
    # database the contract truncates between cases.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vitest strips types without checking them, so the suite is compiled
      # separately. A test that imports a symbol shared no longer exports fails
      # here instead of passing (#144).
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npm run lint:structure
      # The published profile set is guest/profiles/runtime-images.conf; the
      # release workflow builds exactly those and nothing else.
      - run: ./guest/check-profiles.sh
      # Unit and property run once, under instrumentation: the coverage floor in
      # vitest.config.ts fails the build on a regression, and the json-summary
      # here is what `coverage-badge` publishes. Running them twice (plain, then
      # covered) measured the same files twice for no extra signal.
      - run: npm run test:coverage
      # Portable suites that no other job runs. They need no cluster or guest
      # binary; the browser compatibility case skips without its image.
      - run: npm run test:portable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # The standalone `postgres contract` job is gone: `unit` now runs the same
  # suite against Postgres 17, under coverage, so a second job proved the same
  # adapters twice. `npm run test:store-contract` remains for running it alone
  # against a local container. It was never in the required-check set
  # (`unit`, `integration (local guest)`, `markdownlint`, `internal links`), so
  # removing it changes no branch protection.

  # The same contract `unit` runs under coverage, as a named required check.
  # Branch protection lists `postgres contract`, so removing the job without
  # updating protection blocks every merge. Keep it until protection changes.
  postgres-contract:
    name: postgres contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:store-contract
      # Restore drill: seed a database, copy it with CREATE DATABASE … TEMPLATE,
      # then assert the payment, ledger and in-flight session survived the copy
      # (docs/backup-restore.md). Same service container, no extra binaries.
      - run: npm run test:restore-drill

  # Short deterministic budget so PR CI stays fast. The longer soak runs are
  # documented in CONTRIBUTING.md; the nightly fault lane owns the soak.
  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      - run: npm ci
      - run: npm run build
      # One step per target, so the retry in scripts/fuzz-go.sh costs another
      # 20 s for the target that lost the engine's shutdown race instead of
      # re-running the whole matrix. Every failure other than
      # `context deadline exceeded` stays fatal (#130).
      - name: fuzz FuzzOpen (envelope)
        working-directory: guest
        run: ../scripts/fuzz-go.sh ./internal/envelope FuzzOpen 20s
      - name: fuzz FuzzResolve (files)
        working-directory: guest
        run: ../scripts/fuzz-go.sh ./internal/files FuzzResolve 20s
      - name: fuzz FuzzTransferFraming (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzTransferFraming 20s
      - name: fuzz FuzzSupervisorDecrypt (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzSupervisorDecrypt 20s
      - name: fuzz FuzzFrameDecode (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzFrameDecode 20s
      - name: fuzz FuzzChunkDecode (guest)
        working-directory: guest
        run: ../scripts/fuzz-go.sh . FuzzChunkDecode 20s
      - name: typescript fuzz targets
        run: npm run test:fuzz

  integration:
    name: integration (local guest)
    runs-on: ubuntu-latest
    # The integration harness opens Postgres directly and creates a database per
    # worker, so this job needs the same service as `unit`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      - run: npm ci
      - run: npm run build
      - run: make guest
      - name: go tests
        working-directory: guest
        run: go test ./...
      # go test runs only a subset of vet checks. The struct-tag check is not in
      # it, which is how two fields with the same JSON tag shipped and silently
      # dropped the field from every result.
      - name: go vet
        working-directory: guest
        run: go vet ./...
      - name: gofmt
        working-directory: guest
        run: test -z "$(gofmt -l .)"
      # The only run of this suite per push. It SIGSTOPs a real guest process
      # and uses real sockets, so a second concurrent run doubles the runner
      # load and flakes (#145, #128). Coverage must not re-run it.
      - name: integration tests
        env:
          GUEST_BINARY: ${{ github.workspace }}/guest/bin/x402-guest
        run: npm run test:integration

  # The README coverage badge is measured, not hand-maintained. The `unit` job
  # above runs the portable suites (unit, property) under instrumentation and
  # uploads the json-summary; this job turns it into a badge.
  #
  # Integration is deliberately excluded: it already runs once in `integration`,
  # and instrumenting a second concurrent copy is what made #128 and the
  # `stale-frame-recovery` test flake. The cost is the line coverage only those
  # tests reach (the controller lifecycle/reconciler paths); see CONTRIBUTING.md.
  #
  # Writes exactly one JSON file to the `badges` branch, which the README badge
  # reads. Main pushes only, and it never checks out or runs PR code: the
  # artifact is produced by the trusted run, this job only publishes it.
  coverage-badge:
    name: coverage badge
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-report
          path: coverage
      - name: Render badge JSON
        run: node scripts/coverage-badge.mjs coverage/coverage-summary.json badge/coverage.json
      - name: Publish to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" checkout -q -b badges
          cp badge/coverage.json "$tmp/coverage.json"
          git -C "$tmp" add coverage.json
          git -C "$tmp" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: update coverage badge [skip ci]"
          # The branch is a single-file publish target, not history: overwrite
          # it so it cannot grow one commit per main push.
          git -C "$tmp" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # Cluster-backed tests (network isolation, warm pool, checkpoint portability)
  # need kind + Cilium and are intentionally run locally:
  #   make up && make security-test
  #   make demo-portability
