name: release

# Tag-driven builds only. Pushing a tag like v0.1.0 publishes two images:
#   ghcr.io/<owner>/<repo>-control   api + controller + relay + egress + facilitator
#   ghcr.io/<owner>/<repo>-guest     the sandbox runtime (supervisor + toolchain)
#
# Both are multi-arch. The guest image is what actually runs inside the microVM,
# so it must match the cluster's architecture.
#
# Releases are staged. `images` pushes only a run-scoped `staging-*` tag,
# `digests` resolves the immutable index digest, `scan` gates that exact digest,
# `isolation` runs the packet-level and Kata suites against that exact digest,
# and `promote` is the only job allowed to create the version, major.minor and
# `latest` tags. A failed scan or an unrun isolation suite therefore leaves no
# pullable release tag. See docs/release-process.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Run-scoped so a re-run refreshes the same staging image and concurrent runs
  # never overwrite each other. This is intentionally not a release name:
  # nothing should deploy from `staging-*`, and `latest` never points at it.
  STAGING_TAG: staging-${{ github.run_id }}-${{ github.sha }}
  # Registry/repository prefix for both images. Overridable so the promotion
  # script can be rehearsed against a local registry (docs/release-process.md).
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Inlined instead of `uses: ./.github/workflows/ci.yml`: the reusable-workflow
  # call intermittently produced a zero-job callee run, which marked the gate
  # failed and skipped the image build. Main pushes still run the full ci.yml.
  test:
    runs-on: ubuntu-latest
    # Same Postgres 17 service as the `unit` job in ci.yml: the controller store
    # is Postgres only (ADR 0010), and the store contract skips when DATABASE_URL
    # is unset.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Keep this list aligned with the `unit` job in ci.yml. It drifted once:
      # the release gate passed while a test named a symbol that no longer
      # existed and the runtime profile pin set was out of sync.
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npm run lint:structure
      # Same pin check as the `unit` job: a release must not ship an overlay
      # that deploys two different releases.
      - run: node scripts/check-deploy-pins.mjs
      - run: ./guest/check-profiles.sh
      # Same list as the `unit` job in ci.yml, coverage included: the floor in
      # vitest.config.ts is a gate, so it has to hold for a release too.
      - run: npm run test:coverage
      - run: npm run test:portable

  # Build and push the staging tag only. The semver/major.minor/latest tags are
  # created later by `promote`, after both scans pass, so a red scan cannot
  # leave a deployable tag in the registry.
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control
            context: .
            dockerfile: Dockerfile.control
          - name: guest
            context: guest
            dockerfile: guest/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          # One tag, and it is not a release name. Promotion adds the rest.
          tags: |
            type=raw,value=${{ env.STAGING_TAG }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Stamp the promoted images so sandbox_build_info and the OCI labels
          # identify the exact release, not the Dockerfile defaults.
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
          # Publish an SBOM and build provenance alongside each image. Both are
          # attached as OCI attestations, so `docker buildx imagetools inspect`
          # can show what went in without trusting the build log. `imagetools
          # create` copies the whole index, attestations included.
          sbom: true
          provenance: true

      - name: staging digest
        run: |
          echo "${{ matrix.name }}:"
          echo "  ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ env.STAGING_TAG }}"
          echo "  digest ${{ steps.build.outputs.digest }}"

  # Resolve the pushed multi-arch index digest once and hand it to `scan` and
  # `promote`. Every later step addresses the image by digest, so a tag move
  # cannot redirect the scan away from the image that gets promoted.
  digests:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      control: ${{ steps.resolve.outputs.control }}
      guest: ${{ steps.resolve.outputs.guest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: resolve
        run: |
          set -euo pipefail
          for name in control guest; do
            ref="${IMAGE_PREFIX}-${name}:${STAGING_TAG}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            case "$digest" in
              sha256:*) ;;
              *) echo "unexpected digest for $ref: $digest" >&2; exit 1 ;;
            esac
            echo "${name}=${digest}" >> "$GITHUB_OUTPUT"
          done

  # Provenance attestations for the exact digests that get scanned and promoted.
  # Keyless (workflow OIDC), so there is no long-lived key to leak: the
  # attestation binds the image digest to this repository, commit and workflow.
  # `push-to-registry` also attaches it to the GHCR image, and the bundle is
  # attached to the GitHub Release so it can be archived and inspected.
  attest:
    needs: digests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [control, guest]
    steps:
      - id: digest
        env:
          DIGESTS: ${{ toJSON(needs.digests.outputs) }}
        run: |
          set -euo pipefail
          digest=$(jq -r --arg name "${{ matrix.name }}" '.[$name]' <<<"$DIGESTS")
          case "$digest" in
            sha256:*) ;;
            *) echo "no digest for ${{ matrix.name }}: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # `push-to-registry` reads the registry credentials from the Docker
      # config; it does not use the GitHub token on its own. Without this step
      # it fails with "No credentials found for registry ghcr.io".
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Stage release assets
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # The signed bundle is the artifact consumers verify. It is also the
          # filename Scorecard recognises (8/10 without an intoto statement).
          cp "$BUNDLE" "assets/sandbox-${{ matrix.name }}.sigstore.json"
          # The in-toto statement the bundle carries, one object per line, for
          # SLSA tooling and for Scorecard's Signed-Releases check (10/10).
          jq -c '.dsseEnvelope.payload | @base64d | fromjson' "$BUNDLE" \
            > "assets/sandbox-${{ matrix.name }}.intoto.jsonl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attestations-${{ matrix.name }}
          path: assets/
          retention-days: 14

  # Scan the exact staging digest. Policy is unchanged from the previous gate:
  # fixable CRITICAL/HIGH fails, results land in the Security tab. The release
  # tags do not exist yet, so a failure here cannot leave a deployable image.
  scan:
    needs: digests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        name: [control, guest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: digest
        env:
          DIGESTS: ${{ toJSON(needs.digests.outputs) }}
        run: |
          set -euo pipefail
          digest=$(jq -r --arg name "${{ matrix.name }}" '.[$name]' <<<"$DIGESTS")
          case "$digest" in
            sha256:*) ;;
            *) echo "no digest for ${{ matrix.name }}: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload ${{ matrix.name }} results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  # Isolation gate (#44). `security-review/RELEASE_GATE.md` lists Kata
  # guest->host and Cilium pod->pod as UNVERIFIED because nothing in CI ran
  # them. This job runs them against a disposable cluster and records the
  # digests it tested.
  #
  # Three states, decided by scripts/isolation-preflight.mjs (unit-tested):
  #   SANDBOX_ISOLATION_RUNNER set -> run the suites
  #   ISOLATION_EVIDENCE=none      -> skip on purpose, and say so loudly
  #   neither                      -> fail the tag
  # A skip is never implicit: forgetting to configure a runner still blocks.
  isolation-preflight:
    name: isolation runner preflight
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: decide whether the isolation suites run
        id: check
        env:
          SANDBOX_ISOLATION_RUNNER: ${{ vars.SANDBOX_ISOLATION_RUNNER }}
          ISOLATION_EVIDENCE: ${{ vars.ISOLATION_EVIDENCE }}
        run: node scripts/isolation-preflight.mjs preflight

  isolation:
    name: isolation (Kata + Cilium)
    needs: [digests, scan, isolation-preflight]
    runs-on: ${{ fromJSON(needs.isolation-preflight.outputs.runner) }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      # Unique per run: the runner is shared and two releases must not fight
      # over one kind cluster. `down` deletes it even when the suite fails.
      KIND_CLUSTER: sandbox-isolation-${{ github.run_id }}
      KUBECTL_CONTEXT: kind-sandbox-isolation-${{ github.run_id }}
      CONTROL_IMG: x402-sandbox/control:dev
      GUEST_IMG: x402-sandbox/guest:dev
    steps:
      # Checkout is unconditional so the deliberate-skip step can run the same
      # script that produced the decision. Every other step is gated on the
      # mode: skipping the *job* would skip `promote` and block the tag, which
      # is exactly what the acknowledgement exists to avoid.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: record the acknowledged skip
        if: needs.isolation-preflight.outputs.mode != 'run'
        env:
          SANDBOX_ISOLATION_RUNNER: ${{ vars.SANDBOX_ISOLATION_RUNNER }}
          ISOLATION_EVIDENCE: ${{ vars.ISOLATION_EVIDENCE }}
        run: node scripts/isolation-preflight.mjs summary

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.isolation-preflight.outputs.mode == 'run'
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.isolation-preflight.outputs.mode == 'run'
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: needs.isolation-preflight.outputs.mode == 'run'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull the scanned digests and alias them to the deploy tags
        if: needs.isolation-preflight.outputs.mode == 'run'
        env:
          CONTROL_DIGEST: ${{ needs.digests.outputs.control }}
          GUEST_DIGEST: ${{ needs.digests.outputs.guest }}
        run: |
          set -euo pipefail
          # The manifests reference the local dev tags. The bytes behind them are
          # the exact index digests `scan` gated; retagging does not change the
          # image, and scripts/isolation-gate.sh verifies the RepoDigest still
          # names the expected digest before the suite runs.
          for pair in "control:${CONTROL_DIGEST}" "guest:${GUEST_DIGEST}"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            case "$digest" in
              sha256:*) ;;
              *) echo "no digest for ${name}: ${digest}" >&2; exit 1 ;;
            esac
            docker pull "${IMAGE_PREFIX}-${name}@${digest}"
            docker tag "${IMAGE_PREFIX}-${name}@${digest}" "x402-sandbox/${name}:dev"
          done

      - run: npm ci
        if: needs.isolation-preflight.outputs.mode == 'run'

      - run: npm run build
        if: needs.isolation-preflight.outputs.mode == 'run'

      - name: build the guest binaries for the suite
        if: needs.isolation-preflight.outputs.mode == 'run'
        run: make guest

      - name: create the disposable kind + Cilium cluster
        if: needs.isolation-preflight.outputs.mode == 'run'
        run: ./deploy/kind/up.sh

      - name: deploy the release images
        if: needs.isolation-preflight.outputs.mode == 'run'
        run: make deploy

      - name: switch to the Kata RuntimeClass
        if: needs.isolation-preflight.outputs.mode == 'run'
        run: make kata

      - name: isolation gate
        if: needs.isolation-preflight.outputs.mode == 'run'
        env:
          EXPECT_CONTROL_IMAGE: ${{ env.IMAGE_PREFIX }}-control
          EXPECT_CONTROL_DIGEST: ${{ needs.digests.outputs.control }}
          EXPECT_GUEST_IMAGE: ${{ env.IMAGE_PREFIX }}-guest
          EXPECT_GUEST_DIGEST: ${{ needs.digests.outputs.guest }}
          REQUIRE_DIGEST_MATCH: "1"
          ARTIFACTS: artifacts/isolation
        run: make security-isolation

      - name: upload the isolation record
        if: always() && needs.isolation-preflight.outputs.mode == 'run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: isolation-${{ github.run_id }}
          path: artifacts/isolation
          if-no-files-found: warn
          retention-days: 90

      - name: delete the disposable cluster
        if: always() && needs.isolation-preflight.outputs.mode == 'run'
        run: ./deploy/kind/down.sh

  # The only job allowed to create release tags. Runs after both matrix scans
  # and the isolation gate have passed; `imagetools create` retags the scanned
  # index digest in place, so the multi-arch index and its SBOM/provenance
  # attestations are preserved.
  promote:
    name: promote release tags
    needs: [digests, scan, isolation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply version, major.minor and latest
        env:
          CONTROL_DIGEST: ${{ needs.digests.outputs.control }}
          GUEST_DIGEST: ${{ needs.digests.outputs.guest }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          core="${version%%[-+]*}"
          if ! [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to promote non-semver ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          IFS=. read -r major minor _patch <<<"$core"
          major_minor="${major}.${minor}"

          for pair in "control:${CONTROL_DIGEST}" "guest:${GUEST_DIGEST}"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            image="${IMAGE_PREFIX}-${name}"

            echo "promoting ${image}@${digest}"
            docker buildx imagetools create \
              --tag "${image}:${version}" \
              --tag "${image}:${major_minor}" \
              --tag "${image}:latest" \
              "${image}@${digest}"

            # Promotion must not change what was scanned: every release tag has
            # to resolve to the same index digest the scan gated.
            for tag in "${version}" "${major_minor}" "latest"; do
              got=$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')
              if [ "$got" != "$digest" ]; then
                echo "promotion mismatch for ${image}:${tag}: ${got} != ${digest}" >&2
                exit 1
              fi
            done
          done

  # The Release entry is the signal a consumer sees, so it waits for the tags to
  # be promoted rather than for the raw build.
  release:
    name: github release
    needs: [promote, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: attestations-*
          merge-multiple: true
          path: release-assets

      # Renders the same warning block the isolation job wrote to its summary,
      # from the same tested script, so the release notes cannot drift from the
      # decision. Empty when the suites ran.
      - name: isolation evidence note
        id: isolation-note
        env:
          SANDBOX_ISOLATION_RUNNER: ${{ vars.SANDBOX_ISOLATION_RUNNER }}
          ISOLATION_EVIDENCE: ${{ vars.ISOLATION_EVIDENCE }}
        run: node scripts/isolation-preflight.mjs release-note

      - name: Publish release
        id: publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          # Signed provenance for both images. `*.sigstore.json` is the bundle
          # to verify; `*.intoto.jsonl` is the statement it carries.
          files: release-assets/*

      # `append_body` is dropped when the body comes from
      # `generate_release_notes`, so v0.1.26 shipped without the isolation
      # notice or the image section. Both are appended here instead, and the
      # notice comes from the same script that decided the gate.
      - name: append the isolation notice and the image notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          NOTE: ${{ steps.isolation-note.outputs.body }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ -n "${NOTE:-}" ]; then
            printf '%s\n\n' "$NOTE" >> "$notes"
          fi
          gh release view "$TAG" --repo "$REPO" --json body --jq .body >> "$notes"
          printf '\n\n' >> "$notes"
          cat >> "$notes" <<'IMG'
          ## Images

          Multi-arch (`linux/amd64`, `linux/arm64`), published to GHCR:

          - `ghcr.io/${{ github.repository }}-control:${{ github.ref_name }}`
          - `ghcr.io/${{ github.repository }}-guest:${{ github.ref_name }}`

          These tags were created only after both images passed the Trivy
          gate. Each image carries an SBOM and SLSA build provenance as OCI
          attestations:

          ```bash
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}-control:${{ github.ref_name }}
          ```

          ## Verifying provenance

          The `*.sigstore.json` assets are keyless Sigstore bundles produced by
          this workflow, covering exactly the digests above. Verify the image
          itself:

          ```bash
          gh attestation verify \
            oci://ghcr.io/${{ github.repository }}-control:${{ github.ref_name }} \
            --repo ${{ github.repository }}
          ```

          Add `--bundle-from-oci` to check the attestation stored in the
          registry instead of the one on GitHub.

          `*.intoto.jsonl` is the in-toto statement carried inside the bundle,
          for SLSA tooling that consumes statements rather than bundles.

          The guest image is what runs inside the microVM and must match the
          cluster architecture. CVE results for this tag are in the Security
          tab (`trivy-control`, `trivy-guest`).

          Staging images from the build (`staging-<run-id>-<sha>`) are not
          release artifacts; see `docs/release-process.md` for cleanup.
          IMG
          gh release edit "$TAG" --repo "$REPO" --notes-file "$notes"
