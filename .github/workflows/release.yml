name: release

# Tag-driven builds only. Pushing a tag like v0.1.0 publishes two images:
#   ghcr.io/<owner>/<repo>-control   api + controller + relay + egress + facilitator
#   ghcr.io/<owner>/<repo>-guest     the sandbox runtime (supervisor + toolchain)
#
# Both are multi-arch. The guest image is what actually runs inside the microVM,
# so it must match the cluster's architecture.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  # Inlined instead of `uses: ./.github/workflows/ci.yml`: the reusable-workflow
  # call intermittently produced a zero-job callee run, which marked the gate
  # failed and skipped the image build. Main pushes still run the full ci.yml.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:structure
      - run: npm run test:unit
      - run: npm run test:property

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control
            context: .
            dockerfile: Dockerfile.control
          - name: guest
            context: guest
            dockerfile: guest/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Publish an SBOM and build provenance alongside each image. Both are
          # attached as OCI attestations, so `docker buildx imagetools inspect`
          # can show what went in without trusting the build log.
          sbom: true
          provenance: true

      - name: digest
        run: |
          echo "${{ matrix.name }}: ${{ steps.build.outputs.digest }}"

  # Scan the published images. Separate job so a CVE blocks the release signal
  # without preventing the build; the tag is already pushed when this runs.
  # Fixable CRITICAL/HIGH fail the run; results also land in the Security tab.
  scan:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        name: [control, guest]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ steps.ver.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload ${{ matrix.name }} results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  # The tag exists as soon as `images` pushes, so a failed scan never blocks the
  # image build — but it does block the Release entry, which is the signal a
  # consumer sees.
  release:
    name: github release
    needs: [images, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          append_body: |
            ## Images

            Multi-arch (`linux/amd64`, `linux/arm64`), published to GHCR:

            - `ghcr.io/${{ github.repository }}-control:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}-guest:${{ github.ref_name }}`

            Each image carries an SBOM and SLSA build provenance as OCI
            attestations:

            ```bash
            docker buildx imagetools inspect ghcr.io/${{ github.repository }}-control:${{ github.ref_name }}
            ```

            The guest image is what runs inside the microVM and must match the
            cluster architecture. CVE results for this tag are in the Security
            tab (`trivy-control`, `trivy-guest`).
