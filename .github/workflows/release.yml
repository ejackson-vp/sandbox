name: release

# Tag-driven builds only. Pushing a tag like v0.1.0 publishes two images:
#   ghcr.io/<owner>/<repo>-control   api + controller + relay + egress + facilitator
#   ghcr.io/<owner>/<repo>-guest     the sandbox runtime (supervisor + toolchain)
#
# Both are multi-arch. The guest image is what actually runs inside the microVM,
# so it must match the cluster's architecture.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control
            context: .
            dockerfile: Dockerfile.control
          - name: guest
            context: guest
            dockerfile: guest/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: digest
        run: |
          echo "${{ matrix.name }}: ${{ steps.meta.outputs.digest }}"
