# Base runtime image per guest profile, one `profile=runtime-image` per line.
#
# Every line here is a profile the release publishes:
# guest/profiles/<profile>.json must exist for it, the image must be pinned by
# digest, and .github/workflows/release-profiles.yml builds it from this pin.
# `guest/check-profiles.sh` enforces that; `guest/build-profiles.sh` and the
# release workflow both read this file, so a local build is the image the
# release scans and attests.
