<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-labelledby="t">
  <title id="t">sandbox</title>
  <style>
    :root {
      --text: #1f2328;
      --bracket: #0969da;
      --dot: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e6edf3;
        --bracket: #4493f8;
        --dot: #3fb950;
      }
    }
    .t { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 640; letter-spacing: -1.1px; }
    .b { fill: none; stroke: var(--bracket); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .d { fill: var(--dot); }
  </style>

  <!-- mark: a bounded box with something running inside -->
  <path class="b" d="M17 4 H6 Q4 4 4 6 V17"/>
  <path class="b" d="M47 4 H58 Q60 4 60 6 V17"/>
  <path class="b" d="M4 47 V58 Q4 60 6 60 H17"/>
  <path class="b" d="M60 47 V58 Q60 60 58 60 H47"/>
  <rect class="d" x="25.5" y="25.5" width="13" height="13" rx="3.5"/>

  <text class="t" x="78" y="49">sandbox</text>
</svg>
