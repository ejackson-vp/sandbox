<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">sandbox: pay once with x402, get a temporary Linux machine</title>
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#4fe0b8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#4fe0b8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4fe0b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fe0b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2aa889" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#081521"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- corner frame -->
  <rect x="40" y="40" width="1200" height="560" rx="18" fill="none" stroke="#1e3a50" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="88" y="118" fill="#8fb0c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3">DISPOSABLE LINUX · NO ACCOUNTS</text>

  <!-- mark -->
  <g transform="translate(86, 148) scale(1.5)">
    <path d="M17 4 H6 Q4 4 4 6 V17" fill="none" stroke="#b9d4e2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 4 H58 Q60 4 60 6 V17" fill="none" stroke="#b9d4e2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 47 V58 Q4 60 6 60 H17" fill="none" stroke="#b9d4e2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 47 V58 Q60 60 58 60 H47" fill="none" stroke="#b9d4e2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="25.5" y="25.5" width="13" height="13" rx="3.5" fill="#4fe0b8"/>
  </g>

  <!-- title -->
  <text x="210" y="238" fill="#e6f0f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">sandbox</text>

  <!-- tagline -->
  <text x="90" y="308" fill="#c8dbe5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Pay once. Get a temporary Linux machine.</text>

  <text x="90" y="356" fill="#8fb0c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">No accounts · no API keys · no plaintext on the control plane</text>

  <!-- divider -->
  <line x1="90" y1="404" x2="1190" y2="404" stroke="#1a3448" stroke-width="1.5"/>

  <!-- capabilities: durable, unlike a benchmark number -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="90" cy="455" r="5" fill="#4fe0b8"/>
    <text x="110" y="462" fill="#e6f0f3" font-size="24" font-weight="600">x402 payments</text>
    <text x="110" y="490" fill="#8fb0c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">pay per session</text>

    <circle cx="420" cy="455" r="5" fill="#4fe0b8"/>
    <text x="440" y="462" fill="#e6f0f3" font-size="24" font-weight="600">Kata microVMs</text>
    <text x="440" y="490" fill="#8fb0c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">one VM per lease</text>

    <circle cx="750" cy="455" r="5" fill="#4fe0b8"/>
    <text x="770" y="462" fill="#e6f0f3" font-size="24" font-weight="600">sealed commands</text>
    <text x="770" y="490" fill="#8fb0c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">sees only ciphertext</text>
  </g>

  <!-- card -->
  <g transform="translate(1052 440)">
    <rect x="0" y="0" width="138" height="106" rx="14" fill="#0e2232" stroke="url(#edge)" stroke-width="2"/>
    <rect x="18" y="22" width="102" height="30" rx="5" fill="none" stroke="#21405a" stroke-width="1.5"/>
    <rect x="18" y="62" width="60" height="8" rx="4" fill="#21405a"/>
    <circle cx="106" cy="66" r="7" fill="#4fe0b8"/>
  </g>

  <text x="90" y="562" fill="#6d8598" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">github.com/ejackson-vp/sandbox</text>
</svg>
