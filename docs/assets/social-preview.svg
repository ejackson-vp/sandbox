<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">sandbox — pay once with x402, get a temporary Linux machine</title>
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#1f6feb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4493f8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- corner frame -->
  <rect x="40" y="40" width="1200" height="560" rx="18" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="88" y="118" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3">X402 · KATA · KUBERNETES</text>

  <!-- title -->
  <text x="86" y="238" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3">sandbox</text>

  <!-- tagline -->
  <text x="90" y="308" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Pay once. Get a temporary Linux machine.</text>

  <text x="90" y="356" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">No accounts · no API keys · no plaintext on the control plane</text>

  <!-- divider -->
  <line x1="90" y1="404" x2="1190" y2="404" stroke="#21262d" stroke-width="1.5"/>

  <!-- stats -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="90" y="466" fill="#4493f8" font-size="34" font-weight="700">179 ms</text>
    <text x="90" y="494" fill="#8b949e" font-size="16">warm session ready (p50)</text>

    <text x="420" y="466" fill="#4493f8" font-size="34" font-weight="700">53 ms</text>
    <text x="420" y="494" fill="#8b949e" font-size="16">exec round trip (p50)</text>

    <text x="750" y="466" fill="#3fb950" font-size="34" font-weight="700">177</text>
    <text x="750" y="494" fill="#8b949e" font-size="16">CI tests, three suites</text>
  </g>

  <!-- mark -->
  <g transform="translate(1052 440)">
    <rect x="0" y="0" width="138" height="106" rx="14" fill="#161b22" stroke="url(#edge)" stroke-width="2"/>
    <rect x="18" y="22" width="102" height="30" rx="5" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <rect x="18" y="62" width="60" height="8" rx="4" fill="#30363d"/>
    <circle cx="106" cy="66" r="7" fill="#3fb950"/>
  </g>

  <text x="90" y="562" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">github.com/ejackson-vp/sandbox</text>
</svg>
