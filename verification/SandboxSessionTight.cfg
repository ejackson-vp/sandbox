\* Capacity-pressure config: two sessions compete for a one-slot node, so
\* admission must refuse the second reservation and the over-reservation
\* invariant has something to bite on. Two controller restarts and two request
\* ids exercise repeated epoch bumps and the fence. Safety only: the liveness
\* properties are checked by the main config, and fairness makes the graph much
\* larger.
CONSTANT
    Sessions = {s1, s2}
    Payments = {p1, p2}
    Requests = {r1, r2}
    NodeCapacity = 1
    MaxRestarts = 2
    MaxRelayRestarts = 1
    PodIds = {"pod1", "pod2"}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExistingSessions
    NoDoubleCharge
    SettlementAtomic
    OneSessionPerPayment
    SingleActiveOperation
    SingleGuestOperation
    GuestRunsGateHeldRequest
    StaleFrameNeverStarts
    NoStaleFrameStarts
    NoSlotAfterTerminal
    NoOrphanedWorkloadAfterTerminal
    AtMostOnePod
    NoCapacityOverReservation
    ReleasingAfterPodGone
    TerminalDoesNotHoldCompute
    ReadyImpliesPod
    SuspendedImpliesCheckpoint
    ReservationBoundToPayment
    RefundOnlyWhenNoService
    NoEntitlementWithoutPayment
    FenceHoldsTheGate
    NoNewCommandOverlapsFence
    NoPrematureFenceRelease

CHECK_DEADLOCK FALSE
