\* Main bounded config: one session and one payment key on a one-slot node, one
\* operation request id, one controller restart. The liveness properties are
\* checked here; a single session keeps TLC's liveness pass tractable (the
\* two-session capacity and slot-race bounds are in SandboxSessionTight.cfg).
\* The request id is reused after a fence clears because the model does not
\* carry the exec-request idempotency row; the distinct old/new request traces
\* are in the Tight and StaleEpoch configs.
CONSTANT
    Sessions = {s1}
    Payments = {p1}
    Requests = {r1}
    NodeCapacity = 1
    MaxRestarts = 1
    PodIds = {"pod1"}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExistingSessions
    NoDoubleCharge
    SettlementAtomic
    OneSessionPerPayment
    SingleActiveOperation
    SingleGuestOperation
    GuestRunsGateHeldRequest
    StaleFrameNeverStarts
    NoSlotAfterTerminal
    NoOrphanedWorkloadAfterTerminal
    AtMostOnePod
    NoCapacityOverReservation
    ReleasingAfterPodGone
    TerminalDoesNotHoldCompute
    ReadyImpliesPodAndRelay
    SuspendedImpliesCheckpoint
    ReservationBoundToPayment
    RefundOnlyWhenNoService
    NoEntitlementWithoutPayment
    FenceHoldsTheGate
    NoNewCommandOverlapsFence
    NoPrematureFenceRelease

PROPERTIES
    PaidSessionProgress
    TerminalReleasesCapacity
    FencedGateClears

\* The model has legal quiescent states (everything terminal and refunded, or a
\* client that simply stops). Stuck states are caught by the liveness properties
\* above, not by deadlock detection.
CHECK_DEADLOCK FALSE
