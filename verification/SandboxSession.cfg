\* Main bounded config: two sessions and two payment keys against a two-slot
\* node, one operation request id, one controller restart. Everything the
\* liveness properties need, and about three minutes of TLC. The slot race
\* needs two request ids, so it is exercised by SandboxSessionTight.cfg.
CONSTANT
    Sessions = {s1, s2}
    Payments = {p1, p2}
    Requests = {r1}
    NodeCapacity = 2
    MaxRestarts = 1
    PodIds = {"pod1", "pod2"}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExistingSessions
    NoDoubleCharge
    SettlementAtomic
    OneSessionPerPayment
    SingleActiveOperation
    SingleGuestOperation
    NoSlotAfterTerminal
    NoOrphanedWorkloadAfterTerminal
    AtMostOnePod
    NoCapacityOverReservation
    ReleasingAfterPodGone
    TerminalDoesNotHoldCompute
    ReadyImpliesPodAndRelay
    SuspendedImpliesCheckpoint
    ReservationBoundToPayment
    RefundOnlyWhenNoService
    NoEntitlementWithoutPayment

PROPERTIES
    PaidSessionProgress
    TerminalReleasesCapacity
    InterruptedSlotClears

\* The model has legal quiescent states (everything terminal and refunded, or a
\* client that simply stops). Stuck states are caught by the liveness properties
\* above, not by deadlock detection.
CHECK_DEADLOCK FALSE
