# Mode C overlay: hardware confidential computing.
#
# Do not apply this until a real SEV-SNP/TDX node and a Trustee attestation stack
# are in place. Applying it against ordinary hardware makes sandboxes fail closed
# (the intended behaviour, but there is no working demo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
patches:
  - target:
      kind: ConfigMap
      name: control-config
      namespace: sandbox-system
    patch: |-
      - op: replace
        path: /data/EXECUTION_MODE
        value: confidential
      - op: replace
        path: /data/ALLOW_INSECURE_DEV
        value: "false"
      - op: replace
        path: /data/GUEST_IMAGE
        value: "registry.example.com/x402-sandbox/guest@sha256:REPLACE_WITH_PINNED_DIGEST"
  - target:
      kind: RuntimeClass
      name: x402-sandbox
    patch: |-
      - op: replace
        path: /handler
        value: kata-qemu-snp
      - op: replace
        path: /metadata/annotations/x402.io~1confidential
        value: "true"
      - op: replace
        path: /metadata/annotations/x402.io~1warning
        value: "SEV-SNP: hardware confidential computing; requires Trustee attestation"
