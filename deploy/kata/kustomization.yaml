# Mode B overlay: Kata VM, still non-confidential.
#
#   kubectl apply -k deploy/kata
#
# Defaults to kata-qemu-coco-dev (bare metal / VM host with KVM). For
# kind/minikube change the handler to kata-clh (upstream CoCo docs: QEMU does not
# work with kind/minikube).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
patches:
  - target:
      kind: ConfigMap
      name: control-config
      namespace: sandbox-system
    patch: |-
      - op: replace
        path: /data/EXECUTION_MODE
        value: kata
      - op: replace
        path: /data/ALLOW_INSECURE_DEV
        value: "true"
  - target:
      kind: RuntimeClass
      name: x402-sandbox
    patch: |-
      - op: replace
        path: /handler
        value: kata-qemu-coco-dev
      - op: replace
        path: /metadata/annotations/x402.io~1warning
        value: "KATA VM (kata-qemu-coco-dev): separate guest kernel, NO hardware attestation"
