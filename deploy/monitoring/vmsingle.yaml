# VictoriaMetrics single-node: scrape, store and query in one process.
#
# This replaces a Prometheus server for a two-node homelab. It is not highly
# available: one replica, one PVC, `Recreate` on upgrade. Retention is 14 days.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmsingle-data
  labels:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/part-of: sandbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # ~300 MB of samples at 14 days and a few hundred active series; the
      # rest is headroom for compaction and a burst of debug series.
      storage: 2Gi
  # Omit storageClassName so the cluster default is used (portable). The
  # homelab's local-path provisioner exposes `standard` as its default; a
  # cluster with no default class must set this field before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
  labels:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/component: metrics-store
    app.kubernetes.io/part-of: sandbox
spec:
  replicas: 1
  # One writer, one PVC. Recreate avoids two VMSingle processes racing for the
  # same data directory during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmsingle
        app.kubernetes.io/component: metrics-store
        app.kubernetes.io/part-of: sandbox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmsingle
          # Pinned to a release, not `latest`. Bump this with the vmalert tag.
          image: victoriametrics/victoria-metrics:v1.156.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod=14d
            - -promscrape.config=/etc/vmscrape/scrape.yml
            - -httpListenAddr=:8428
            # Scrape VictoriaMetrics' own process metrics; useful when the
            # store itself is the thing that is slow.
            - -selfScrapeInterval=30s
            # Keep the cache budget bounded on a node that also runs sandboxes.
            - -memory.allowedBytes=256MiB
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            # The upstream image has no non-root user and writes its data
            # directory as root. The pod has no host mounts, drops all
            # capabilities and uses the default seccomp profile.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: scrape
              mountPath: /etc/vmscrape
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vmsingle-data
        - name: scrape
          configMap:
            name: vmsingle-scrape-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle
  labels:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/component: metrics-store
    app.kubernetes.io/part-of: sandbox
spec:
  # ClusterIP only. There is deliberately no Ingress: metrics and the query
  # API stay on the pod network.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmsingle
  ports:
    - name: http
      port: 8428
      targetPort: http
