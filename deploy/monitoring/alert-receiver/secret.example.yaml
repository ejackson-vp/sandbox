# Example of the Secret the receiver and the Hermes webhook route share.
#
# Do not commit a filled-in copy, and do not add this file to
# kustomization.yaml. A deployed environment creates it from its own secret
# store; locally:
#
#   kubectl -n hermes create secret generic hermes-alert-receiver \
#     --from-literal=alertmanager-token="$(openssl rand -hex 32)" \
#     --from-literal=hermes-webhook-secret="$(openssl rand -hex 32)"
#
# Every value is a real credential:
#   alertmanager-token           Alertmanager -> receiver, sent as a bearer token
#   alertmanager-token-previous  optional, only while rotating; see README.md
#   hermes-webhook-secret        receiver -> Hermes, HMAC-SHA256 key for the
#                                generic V2 signature on the webhook POST
#
# The Alertmanager side needs a copy of the token in its own namespace, because
# `credentials_file` cannot read across namespaces. That second copy is the only
# reason rotation has an order; it is written out step by step in
# ../../contract/alerting/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-alert-receiver
  namespace: hermes
  labels:
    app.kubernetes.io/part-of: hermes
type: Opaque
stringData:
  alertmanager-token: <generated>
  hermes-webhook-secret: <generated>
