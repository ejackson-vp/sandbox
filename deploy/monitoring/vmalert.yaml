# vmalert evaluates the SLO rules against VMSingle and writes the resulting
# `ALERTS` / `ALERTS_FOR_STATE` series back to VMSingle, so Grafana (and a
# query) can see the alert state.
#
# There is deliberately no Alertmanager. `-notifier.blackhole` tells vmalert to
# evaluate alerting rules without trying to deliver notifications. To page,
# replace that flag with `-notifier.url=<alertmanager-or-webhook-bridge>` and
# add a receiver. The rules themselves are portable Prometheus rule files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/component: rules
        app.kubernetes.io/part-of: sandbox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          # Keep this tag aligned with victoriametrics/victoria-metrics.
          image: victoriametrics/vmalert:v1.156.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/*.yaml
            - -datasource.url=http://vmsingle:8428
            - -remoteRead.url=http://vmsingle:8428
            - -remoteWrite.url=http://vmsingle:8428
            - -evaluationInterval=30s
            - -httpListenAddr=:8880
            # Evaluate, persist alert state, but do not deliver notifications.
            # See the header comment before changing this.
            - -notifier.blackhole
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            # The upstream image has no non-root user; it is stateless and
            # writes nothing except the mounted /tmp.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: sandbox
spec:
  # ClusterIP only; reach the UI with `kubectl port-forward`.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
