# Lightweight monitoring for the two-node homelab.
#
#   kubectl kustomize deploy/monitoring          # render only
#   kubectl apply -k deploy/monitoring           # apply by hand
#
# In the homelab Flux owns this path as a separate Kustomization from
# `apps/sandbox`; see README.md. Nothing here creates an Ingress, a
# LoadBalancer or a public Service.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  # The #37 scrape contract (bare-list form) is kept for an existing
  # Prometheus. VMSingle consumes the full-document mirror below.
  - prometheus-scrape.yaml
  - vmsingle-scrape-config.yaml
  - vmsingle.yaml
  - vmalert.yaml
  - grafana.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: vmalert-rules
    files:
      - sandbox-slo.yaml=rules/sandbox-slo.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yaml=grafana/dashboards.yaml
  - name: grafana-dashboard-sandbox
    files:
      - sandbox-control-plane.json=grafana-dashboard.json
