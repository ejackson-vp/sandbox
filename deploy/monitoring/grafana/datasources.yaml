# Provisioned datasource. The uid is fixed so provisioned dashboards always
# resolve; the dashboard's `DS_PROMETHEUS` variable uses the same uid.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: vmsingle
    type: prometheus
    access: proxy
    url: http://vmsingle.monitoring.svc.cluster.local:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
