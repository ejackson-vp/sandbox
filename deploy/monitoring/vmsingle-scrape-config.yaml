# VictoriaMetrics needs the full Prometheus config document (`scrape_configs:`
# plus optional `global:`), unlike kube-prometheus-stack's
# `additionalScrapeConfigs`, which takes a bare list. The bare-list contract
# remains in `prometheus-scrape.yaml` so an existing Prometheus can consume it.
#
# Keep the targets and labels here in sync with that file. Both jobs scrape the
# same three private :9100 listeners; neither listener is reachable through the
# public API Service or ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-scrape-config
  labels:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/part-of: sandbox
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      # Add `external_labels` here if this cluster is federated into a larger
      # monitoring system. Left out by default so the homelab series names stay
      # identical to the Prometheus contract.
    scrape_configs:
      - job_name: sandbox-control
        scheme: http
        metrics_path: /metrics
        static_configs:
          - targets:
              - api.sandbox-system.svc.cluster.local:9100
            labels:
              role: api
          - targets:
              - controller.sandbox-system.svc.cluster.local:9100
            labels:
              role: controller
          - targets:
              - relay.sandbox-system.svc.cluster.local:9100
            labels:
              role: relay
