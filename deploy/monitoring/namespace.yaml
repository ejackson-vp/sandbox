# The control-plane NetworkPolicy (`allow-metrics-scrape`) admits scrapes from
# a namespace named `monitoring` or `observability`. This stack uses
# `monitoring`; keep the name if you reuse that policy.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: sandbox
    # The VM image runs as root (it has no non-root user), Grafana drops to
    # 472 and vmalert runs as root. Baseline is the strongest profile that
    # still admits the upstream images; no pod needs host namespaces or
    # privileged capabilities.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
