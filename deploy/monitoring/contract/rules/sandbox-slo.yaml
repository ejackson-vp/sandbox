# Sandbox SLO rules.
#
# Portable Prometheus/vmalert rule file. The scrape job adds a `role` label
# (`api`, `controller`, `relay`), so most expressions below select the process
# that owns the metric instead of double-counting across roles. The warm-pool
# profile rules and the ledger audit rules deliberately do not: those families
# are controller-only and must keep working when a deployment scrapes one
# process without a role label.
#
# Thresholds are the ones agreed in issue #38. They are deliberately small and
# explainable for a single-tenant homelab; tune them only with a recorded
# reason. `reconciliation_pending`, the warm-pool rules and the ledger audit
# rules carry caveats in deploy/monitoring/README.md: the API does not export a
# per-error-code counter, the warm pool can be disabled, and the audit gauges
# are absent until the first successful sample.
groups:
  - name: sandbox-slo
    interval: 30s
    rules:
      - alert: SandboxCreateP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(sandbox_session_create_duration_seconds_bucket{role="api"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Session create p95 is above 500 ms"
          description: >-
            The API create route has held a p95 above 500 ms for 10 minutes
            (current {{ $value }} s). Check payment/settlement
            latency, controller admission and database wait time before
            assuming the API process is at fault.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxProvisioningTimeoutRateHigh
        expr: |
          (
            sum(rate(sandbox_provision_failures_total{role="controller",reason="provisioning_timeout"}[10m]))
            /
            clamp_min(sum(rate(sandbox_sessions_created_total{role="controller"}[10m])), 0.001)
          ) > 0.01
        for: 10m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Provisioning timeouts are above 1% of creates"
          description: >-
            More than 1% of entitlements have failed with
            `provisioning_timeout` over the last 10 minutes (current ratio
            {{ $value }}). Check controller logs, Kubernetes scheduling and the
            guest image pull path.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxProvisioningQueueWaitP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(sandbox_provisioning_wait_seconds_bucket{role="controller"}[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Provisioning queue wait p95 is above 5 s"
          description: >-
            Paid sessions have waited more than 5 s at p95 for a provisioning
            slot for 10 minutes (current {{ $value }} s).
            Check `sandbox_provisioning_queued`, capacity reservations and the
            reconcile in-flight count.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxRelayPendingRequests
        expr: max(sandbox_relay_pending_requests{role="controller"}) > 0
        for: 5m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "The relay has had a request pending for 5 minutes"
          description: >-
            `sandbox_relay_pending_requests` has stayed above zero for 5
            minutes (current {{ $value }}). A guest is not answering a
            forwarded operation; check relay disconnects and the session's
            guest process.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxReconcileP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(sandbox_reconcile_duration_seconds_bucket{role="controller"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Reconcile pass p95 is above 1 s"
          description: >-
            The controller reconcile pass has held a p95 above 1 s for 10
            minutes (current {{ $value }} s). Check
            `sandbox_reconcile_queue_depth`, Kubernetes API latency and
            database wait time.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxReconciliationPending
        expr: |
          sum(
            increase(
              sandbox_http_requests_total{
                role="api",
                route="/v1/sessions",
                method="POST",
                status="409"
              }[10m]
            )
          ) > 0
        for: 5m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Create requests are returning 409 conflicts"
          description: >-
            The API returned at least one 409 on `POST /v1/sessions` in the
            last 10 minutes and it has persisted for 5 minutes. Today this is
            the closest existing signal for `reconciliation_pending`; it also
            catches `payment_in_progress`, `spec_mismatch`, `entitlement_missing`
            and non-retryable capacity conflicts until a per-code counter is
            added. Check API logs for `settlement_lookup_failed` and
            `payment_idempotent_replay`.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxWarmPoolEmpty
        expr: |
          sum(sandbox_warm_pool_pods) == 0
          and on ()
          sum(sandbox_warm_pool_budget) > 0
        for: 5m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "No runtime profile has a live warm pod"
          description: >-
            Every profile in `sandbox_warm_pool_pods` has been at zero for 5
            minutes while at least one profile still has a non-zero target.
            Check pod scheduling, capacity preflight rejections and
            `warm_pod_create_failed` in the controller log. This rule is gated
            on `sum(sandbox_warm_pool_budget) > 0`, so it stays inactive when
            `WARM_POOL_SIZE=0`.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      # Runtime-profile warm pools. Each profile has its own target inside one
      # shared `WARM_POOL_SIZE` budget. These expressions do not select on
      # `role`: the families are exported only by the controller, and a single
      # scrape target without a role label must still evaluate them.
      - alert: SandboxWarmPoolMissPressure
        expr: |
          (
            sum by (profile) (rate(sandbox_warm_pool_total{result="miss_empty"}[15m]))
            /
            clamp_min(
              sum by (profile) (
                rate(sandbox_warm_pool_total{result=~"hit|miss_empty"}[15m])
              ),
              0.001
            )
          ) > 0.2
          and on (profile)
          (
            sum by (profile) (
              increase(sandbox_warm_pool_total{result=~"hit|miss_empty"}[15m])
            ) >= 20
          )
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Warm pool misses for {{ $labels.profile }} are above 20%"
          description: >-
            More than 20% of claims for the `{{ $labels.profile }}` profile
            have fallen back to a cold start over the last 15 minutes (current
            {{ $value | humanizePercentage }}, at least 20 claims). Check
            `sandbox_warm_pool_budget{profile="{{ $labels.profile }}"}`
            against `sandbox_warm_pool_pods`, the growth decisions, and whether
            `WARM_POOL_SIZE` has free headroom above `WARM_POOL_BASE_MIN`.
            A single miss does not fire this rule.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxWarmPoolSustainedMisses
        expr: |
          sum by (profile) (
            increase(sandbox_warm_pool_total{result="miss_empty"}[15m])
          ) >= 20
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "{{ $labels.profile }} is taking sustained cold starts"
          description: >-
            The `{{ $labels.profile }}` profile has produced {{ $value |
            humanize }} `miss_empty` claims in the last 15 minutes and has held
            that rate for 15 minutes. A miss here means a session paid the cold
            path. Check the profile target, live pods and the growth decisions
            for budget, cooldown or budget-exhausted blocks.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxWarmPoolUnderTarget
        expr: |
          (
            sum by (profile) (sandbox_warm_pool_budget)
            -
            sum by (profile) (sandbox_warm_pool_pods)
          ) > 0
          and on (profile)
          (
            sum by (profile) (sandbox_warm_pool_budget) > 0
          )
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Warm pool {{ $labels.profile }} cannot reach its target"
          description: >-
            The `{{ $labels.profile }}` profile has held fewer live warm pods
            than its target for 15 minutes (short by {{ $value }} pods). The
            controller wants to fill the pool but creates are not landing.
            Check pod scheduling, capacity preflight rejections, image pulls
            and `warm_pod_create_failed` in the controller log.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxWarmPoolBudgetExhausted
        expr: |
          sum by (profile) (
            increase(sandbox_warm_pool_grow_total{result="budget_exhausted"}[30m])
          ) >= 3
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Warm pool growth for {{ $labels.profile }} is blocked by the budget"
          description: >-
            The `{{ $labels.profile }}` profile has hit `budget_exhausted`
            {{ $value | humanize }} times in 30 minutes and held the condition
            for 15 minutes. The sum of all profile targets has reached
            `WARM_POOL_SIZE` and no idle profile had headroom above its floor.
            Check `sum(sandbox_warm_pool_budget)` against `WARM_POOL_SIZE`, and
            check `WARM_POOL_BASE_MIN`: it defaults to `WARM_POOL_SIZE`, which
            leaves `base` unable to donate and starves every other profile.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxWarmPoolDrainThrash
        expr: |
          (
            sum by (profile) (
              increase(sandbox_warm_pool_drain_total{reason="idle"}[1h])
            ) >= 5
          )
          and on (profile)
          (
            sum by (profile) (
              increase(sandbox_warm_pool_grow_total{result=~"budget|steal"}[1h])
            ) >= 5
          )
        for: 30m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Warm pool {{ $labels.profile }} is draining and regrowing"
          description: >-
            The `{{ $labels.profile }}` profile has drained and regrown at
            least 5 times each in the last hour (drains: {{ $value | humanize
            }}). Capacity is oscillating instead of settling. Check
            `WARM_POOL_IDLE_DRAIN_MS` against `WARM_POOL_DEMAND_WINDOW_MS` and
            `WARM_POOL_COOLDOWN_MS`; if the regrowth came from `steal`, a
            neighbouring profile is being drained to fund this one.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      # Egress byte budgets. `controller/src/egress-proxy.ts` refuses a chunk
      # that would cross either bound and destroys the tunnel, so these are the
      # volume counterpart of the connection caps above. Both families are
      # exported only by the proxy role, which is not one of the three scrape
      # targets in deploy/monitoring/contract/prometheus-scrape.yaml: add
      # `egress-proxy.sandbox-system.svc.cluster.local:9100` with
      # `role: proxy` before relying on them (docs/runbooks/egress-abuse.md).
      # Like the warm-pool and audit rules they do not select on `role`, so a
      # single target scraped without the label still evaluates them.
      #
      # The bytes counter carries the same total under `scope="session"` and
      # `scope="global"` by construction, so every expression selects one scope
      # and never sums across them.
      - alert: SandboxEgressBytesNearCap
        expr: |
          sum(increase(sandbox_egress_bytes_total{scope="global"}[1h]))
          > 15 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Egress volume is above 75% of the global hourly budget"
          description: >-
            The proxy has moved more than 15 GiB in the last hour (current
            {{ $value | humanize1024 }}B) against the 20 GiB default for
            `EGRESS_MAX_BYTES_GLOBAL_WINDOW`. This is the proximity signal: once
            the window is exhausted, every tunnel is refused with
            `sandbox_egress_limit_total{scope="global"}` and paying sessions
            break. Check the per-tenant suspects in the proxy log first, decide
            whether the volume is abuse or a cap set too low, and raise the
            bound only with a recorded reason. If the window was changed from
            one hour, change the range and the threshold with it.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxEgressLimitRejections
        expr: sum by (scope) (increase(sandbox_egress_limit_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "Egress byte budget refusals ({{ $labels.scope }})"
          description: >-
            {{ $value | humanize }} tunnel chunks were refused by the
            `{{ $labels.scope }}` egress byte budget in the last 15 minutes, and
            the condition has held for 5. A refusal destroys the tunnel, so this
            is a session that was cut off, not a soft throttle:
            `scope="session"` means one tenant crossed
            `EGRESS_MAX_BYTES_PER_SESSION` (1 GiB by default) and is either
            abusing the proxy as an exit node or moving a legitimate large file;
            `scope="global"` means the whole proxy hit the hourly window and
            every tenant is affected. Read
            docs/runbooks/egress-abuse.md before raising either bound.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxMetricsTargetDown
        expr: up{job="sandbox-control"} == 0
        for: 2m
        labels:
          severity: critical
          service: sandbox
        annotations:
          summary: "A sandbox control-plane metrics target is down"
          description: >-
            The {{ $labels.role }} role on {{ $labels.instance }} has been
            unscrapeable for 2 minutes. This is the leading indicator for the
            per-role alerts: if the process is gone, its application metrics
            are stale rather than low.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxBlastRadius
        expr: |
          (
            max_over_time(sandbox_relay_sessions{role="controller"}[15m]) >= 5
          )
          and on()
          (
            min(up{job="sandbox-control", role=~"controller|relay"}) == 0
          )
        for: 5m
        labels:
          severity: critical
          service: sandbox
        annotations:
          summary: "A control-plane role is down with sessions in flight"
          description: >-
            The controller or relay has been down for 5 minutes while at least
            5 relay sessions were registered in the preceding 15 minutes
            (affected count: {{ $value }}). This is the blast-radius rule from
            issue #38: per-component health can be green while a tenant impact
            is large. Check the down role first, then tell the affected tenant.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      # Ledger audit. `controller/src/ledger-audit-sampler.ts` publishes one
      # sample per `LEDGER_AUDIT_INTERVAL_MS` (300 s by default, one second to
      # one hour accepted). Three properties of that sampler shape the rules:
      #
      #  - the divergence, stale and age gauges are created by the first
      #    successful sample, so before one lands the families are absent
      #    rather than zero. `x > 0` cannot see "never sampled";
      #  - a failed read leaves the last good counts and their timestamp in
      #    place, so a failure is neither a fresh reading nor a clean one;
      #  - the age gauge is recomputed from the clock on every scrape, so it
      #    keeps rising when the timer has stopped.
      #
      # Like the warm-pool rules these do not select on `role`: the families
      # are exported only by the controller, and a deployment that scrapes a
      # single process without a role label must still evaluate them.
      - alert: SandboxLedgerDivergence
        expr: max by (reason) (sandbox_ledger_divergence) > 0
        for: 1m
        labels:
          severity: critical
          service: sandbox
        annotations:
          summary: "Ledger divergence: {{ $labels.reason }}"
          description: >-
            The last completed audit sample found {{ $value | humanize }}
            payment intent and ledger pairs that disagree, reason
            `{{ $labels.reason }}`. Every reason is money and records
            disagreeing: `settled_without_ledger` is a settled intent with no
            ledger row, `intent_failed_ledger_settled` is a refused payment the
            books say was delivered, and `duplicate_refund_claim` is one signed
            authorisation being refunded twice. There is no safe threshold and
            no reason to wait for a second sample, so any non-zero count pages;
            the gauge only moves on a completed sample, so 1 minute means one
            sample confirmed, not scrape noise. Look the key up with
            `GET /internal/payments/<paymentKey>` and read
            docs/payment-ledger.md before touching the rows.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxSessionsStale
        expr: max by (phase) (sandbox_sessions_stale) >= 3
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "{{ $value }} sessions are past their deadline in {{ $labels.phase }}"
          description: >-
            Three or more sessions in `{{ $labels.phase }}` have been past
            their deadline by more than the 60 s grace period for 15 minutes
            (current count: {{ $value }}). The threshold is three, not one: a
            single long-lived session, or one reconciler pass running late,
            is not a cleanup outage. Three sessions still overdue across three
            audit samples mean termination is not finishing. Check the
            reconciler's `sandbox_lease_expired` log line,
            `sandbox_reconcile_queue_depth` and admission capacity before
            terminating the rows by hand.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxLedgerAuditStale
        expr: max(sandbox_ledger_audit_age_seconds) > 600
        for: 5m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "The ledger audit has not completed a sample in two intervals"
          description: >-
            `sandbox_ledger_audit_age_seconds` has been above 600 s for 5
            minutes (current {{ $value }} s). 600 s is two default sampling
            intervals (`LEDGER_AUDIT_INTERVAL_MS` defaults to 300000), so two
            intervals have passed without a successful sample: one tick was
            missed and the next did not land either, or the timer is stopped.
            The age is recomputed on every scrape, so a stopped sampler cannot
            look fresh. Check the controller log for audit read failures, the
            Postgres connection and `LEDGER_AUDIT_INTERVAL_MS`. If that
            interval is raised, raise this threshold with it: the rule is two
            intervals, not 600 s.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxLedgerAuditNeverSampled
        expr: absent(sandbox_ledger_audit_age_seconds)
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "The ledger audit has never completed a sample"
          description: >-
            `sandbox_ledger_audit_age_seconds` has been absent for 15 minutes,
            which means no audit sample has ever succeeded. The gauge families
            are created by the first successful sample, so the divergence and
            stale rules above match nothing in this state: `> 0` cannot fire on
            a series that does not exist. Three default intervals is longer
            than the startup sample plus a slow first read, so this is not a
            deploy race. Check that the controller role is the one running
            (`start()` is called there only), that it can reach Postgres, and
            whether `sandbox_ledger_audit_failures_total` is climbing. If the
            controller target is also down, `SandboxMetricsTargetDown` is the
            primary alert.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"

      - alert: SandboxLedgerAuditFailing
        expr: increase(sandbox_ledger_audit_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          service: sandbox
        annotations:
          summary: "The ledger audit keeps failing to read the store"
          description: >-
            Audit samples have failed in every 15 minute window for 15 minutes
            ({{ $value | humanize }} failures in the current window). A failed
            read changes no gauge: the last good counts and their timestamp are
            kept, so this is the signal for an audit that fails part of the
            time but still succeeds often enough to keep
            `SandboxLedgerAuditStale` quiet. A single failed sample is a blip
            and does not fire this rule. Check Postgres reachability, the
            read-only audit connection and its 2 s statement timeout; the
            age alert takes over if every sample starts failing.
          runbook_url: "https://github.com/ejackson-vp/sandbox/blob/main/deploy/monitoring/README.md#alerts"
