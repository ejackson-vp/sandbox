# One scrape job covers all four control-plane roles. The relay and the egress
# proxy run as StatefulSets, so they are scraped by their stable per-pod names
# rather than the shardless Service: a DNS target behind two pods alternates
# between two independent processes and every counter delta resets on the
# switch. A scaled api or controller should move to pod discovery with
# `containerPort: metrics` (the pods already name the port `metrics`).
#
# This is the bare-list contract for an existing Prometheus.
# `vmsingle-scrape-config.yaml` mirrors the same targets in the full-document
# form VictoriaMetrics needs; change both together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-scrape-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: sandbox
data:
  # A YAML list, ready for prometheus.additionalScrapeConfigs.
  sandbox-scrape-configs.yaml: |
    - job_name: sandbox-control
      scheme: http
      metrics_path: /metrics
      scrape_interval: 15s
      scrape_timeout: 10s
      static_configs:
        - targets:
            - api.sandbox-system.svc.cluster.local:9100
          labels:
            role: api
        - targets:
            - controller.sandbox-system.svc.cluster.local:9100
          labels:
            role: controller
        - targets:
            # Fully qualified: the stable pod names resolve inside sandbox-system
            # only, and Prometheus scrapes from another namespace.
            - relay-0.relay-headless.sandbox-system.svc.cluster.local:9100
            - relay-1.relay-headless.sandbox-system.svc.cluster.local:9100
          labels:
            role: relay
        - targets:
            # The only exporter of sandbox_egress_bytes_total and
            # sandbox_egress_limit_total. Without this target the egress byte
            # rules evaluate against no data and never fire.
            - egress-proxy-0.egress-proxy-headless.sandbox-system.svc.cluster.local:9100
          labels:
            role: proxy
