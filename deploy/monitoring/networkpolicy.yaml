# Egress policies for the monitoring namespace.
#
# The sandbox side already owns the real boundary: `allow-metrics-scrape` in
# deploy/kubernetes/21-networkpolicy-control.yaml admits only the `monitoring`
# or `observability` namespace on TCP 9100. These rules keep the monitoring
# pods themselves from talking to anything except the scraped roles, the store
# and DNS, which matters if the cluster has a default-deny egress policy.
#
# They deliberately do not restrict ingress. All Services here are ClusterIP
# with no Ingress, so the only way in is `kubectl port-forward`. If your
# cluster applies a default-deny ingress to `monitoring`, add an explicit rule
# for Grafana 3000 and for the port-forward source you use.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle-egress
  labels:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/part-of: sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-system
      ports:
        - protocol: TCP
          port: 9100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalert-egress
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
      ports:
        - protocol: TCP
          port: 8428
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    # Query path for every panel.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
      ports:
        - protocol: TCP
          port: 8428
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
