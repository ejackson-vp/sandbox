# Talos overlay — the reference deployment.
#
#   kubectl kustomize deploy/talos   # render
#
# In a Flux-managed deployment this path is reconciled from a private
# repository, not applied by hand.
#
# Builds on deploy/kata (microVM isolation) and adds what a real, non-kind
# cluster needs: published images, a real guest image reference, and the public
# base URL.
#
# Node preparation is NOT handled here — a node must be labelled before
# sandboxes can schedule. See README.md.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../kata
  # The controller must reach the kube-apiserver. Kubernetes NetworkPolicy
  # cannot express that once the ClusterIP has been DNAT'ed, so Cilium's
  # `kube-apiserver` entity is required. Only valid on a Cilium cluster, which
  # is why it lives here and not in the base.
  - ../kubernetes/cilium

# PITR (ADR 0015) is deliberately not a component of this overlay.
#
# It cannot be: the component needs a bucket, a `postgres-pitr` Secret and a
# pushed pgBackRest image, and none of them exists in any environment yet. An
# apply without them does not degrade, it stops the database (ImagePullBackOff on
# the postgres container, or a missing Secret), which is a worse outcome than the
# nightly dump this is meant to replace.
#
# `deploy/pitr` is this overlay plus the component, which is the shape to apply
# once those three things exist:
#
#   kubectl kustomize deploy/pitr | kubectl diff -f -
#   kubectl apply -k deploy/pitr
#
# To turn it on here instead, add:
#
#   components:
#     - ../kubernetes/pitr

# Published by .github/workflows/release.yml on a git tag v*.
# NOTE: the workflow uses semver pattern {{version}}, so the IMAGE tag has no
# `v` prefix: git tag v0.1.0 -> image tag 0.1.0. Getting this wrong is an
# ImagePullBackOff, not an error at apply time.
#
# Everything below is one release: the control tag, the guest tag and the guest
# digest. Do not edit these values by hand. A tag deploys the tree it was cut
# from, so a stale pin deploys the previous release and nothing in the cluster
# complains; v0.1.31 shipped 0.1.30 images that way. Move them together:
#
#   npm run release:bump-pins -- --version 0.1.32 --guest-digest sha256:... \
#     --profile-digest python=sha256:... --profile-digest node=sha256:...
#
# scripts/check-deploy-pins.mjs compares this overlay, deploy/release-pins.json
# and the Kyverno allowlist, and on a tag build it also fails when they name a
# release other than the tag.
images:
  - name: x402-sandbox/control
    newName: ghcr.io/ejackson-vp/sandbox-control
    newTag: 0.1.37
  # 0.1.30 runs two relay shards and fixes the warm pool's relay addressing:
  # it now follows RELAY_GUEST_ADDRESS instead of always dialling a ClusterIP.
  # The guest below is the 0.1.30 build from the same tag. Do not move one
  # without the other: scripts/check-deploy-pins.mjs compares this overlay, the
  # release map and the Kyverno allowlist, and fails when they name different
  # releases.
  #
  # The PITR component names `x402-sandbox/postgres-pitr:17`, which is what
  # `docker build -f Dockerfile.postgres-pitr` produces. Add its registry name
  # and digest here once it is pushed. scripts/check-deploy-pins.mjs does not
  # cover this image, so the digest in this file is the only pin.

patches:
  - target:
      kind: ConfigMap
      name: control-config
      namespace: sandbox-system
    patch: |-
      - op: replace
        path: /data/GUEST_IMAGE
        value: ghcr.io/ejackson-vp/sandbox-guest:0.1.34
      # Index digest of the release above. The controller pulls
      # `repo@sha256:…` whenever a digest is set (dev mode or not), so a moved
      # tag cannot change what runs inside the sandbox.
      - op: replace
        path: /data/GUEST_IMAGE_DIGEST
        value: sha256:5ed54d91f71829d8dd418caa4b208d86ba8699c1889c089eac9d8198b60b0630
      # The warm pool: 20 idle pods, the shape this directory's README sizes in
      # section 1.1 against two 13 GiB nodes (20 x 512 MiB limit), and the pool
      # the performance numbers in the top-level README were measured on.
      #
      # Both keys are set here, and WARM_POOL_SIZE must come with the minimum:
      # the base ships WARM_POOL_SIZE=0, so setting only WARM_POOL_BASE_MIN
      # leaves 16 > 0 and the controller refuses to start
      # (controller/src/config/warm-pool.ts). Keep most of the budget on the
      # default profile; `python` and `node` start at zero and grow from
      # observed misses into the remaining 4 slots.
      - op: replace
        path: /data/WARM_POOL_SIZE
        value: "20"
      - op: add
        path: /data/WARM_POOL_BASE_MIN
        value: "16"
      - op: add
        path: /data/RUNTIME_PROFILES
        value: '{"python":{"image":"ghcr.io/ejackson-vp/sandbox-guest","digest":"sha256:220b7f9af2a24b560f8e2fbb48927b2b0d724929a10d81e5cc67d729949ec7f4"},"node":{"image":"ghcr.io/ejackson-vp/sandbox-guest","digest":"sha256:0909b96b96ff89ff1790040e0675090044c60dd01ce02176f396718fb45db58a"}}'
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: https://sandbox.example.ts.net
