# Talos overlay — the homelab deployment.
#
#   kubectl kustomize deploy/talos   # render
#
# In the homelab this path is reconciled by Flux (apps/sandbox/release.yaml),
# not applied by hand.
#
# Builds on deploy/kata (microVM isolation) and adds what a real, non-kind
# cluster needs: published images, a real guest image reference, and the public
# base URL.
#
# Node preparation is NOT handled here — a node must be labelled before
# sandboxes can schedule. See README.md.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../kata
  # The controller must reach the kube-apiserver. Kubernetes NetworkPolicy
  # cannot express that once the ClusterIP has been DNAT'ed, so Cilium's
  # `kube-apiserver` entity is required. Only valid on a Cilium cluster, which
  # is why it lives here and not in the base.
  - ../kubernetes/cilium

# Published by .github/workflows/release.yml on a git tag v*.
# NOTE: the workflow uses semver pattern {{version}}, so the IMAGE tag has no
# `v` prefix: git tag v0.1.0 -> image tag 0.1.0. Getting this wrong is an
# ImagePullBackOff, not an error at apply time.
images:
  - name: x402-sandbox/control
    newName: ghcr.io/ejackson-vp/sandbox-control
    newTag: 0.1.24
  # 0.1.9 adds the mTLS controller listener and the inlined release gate. (npm removed from the
  # runtime, Go 1.27.3 + x/crypto 0.58.0 in the guest).

patches:
  - target:
      kind: ConfigMap
      name: control-config
      namespace: sandbox-system
    patch: |-
      - op: replace
        path: /data/GUEST_IMAGE
        value: ghcr.io/ejackson-vp/sandbox-guest:0.1.24
      # Index digest from the v0.1.24 release. The controller pulls
      # `repo@sha256:…` whenever a digest is set (dev mode or not), so a moved
      # tag cannot change what runs inside the sandbox.
      - op: replace
        path: /data/GUEST_IMAGE_DIGEST
        value: sha256:915aa25799d74ca7505c664aee5d461fcc9b8f03f105cd88c4c10966a2761f33
      # Keep most of the warm budget on the default profile. Other profiles
      # start at zero and grow from observed misses into the remaining slots.
      - op: add
        path: /data/WARM_POOL_BASE_MIN
        value: "16"
      - op: add
        path: /data/RUNTIME_PROFILES
        value: '{"python":{"image":"ghcr.io/ejackson-vp/sandbox-guest","digest":"sha256:62487a7bda310bcf3b5992c4b02d74befbf8d2118cbfb36b2ad0da16fac2528e"},"node":{"image":"ghcr.io/ejackson-vp/sandbox-guest","digest":"sha256:c28d2e0338abf9bdf1742a2623b1f0be772dd9e050debd9894f17a0c10000007"}}'
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: https://sandbox.example.ts.net
