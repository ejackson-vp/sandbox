apiVersion: v1
kind: ConfigMap
metadata:
  name: control-config
  namespace: sandbox-system
data:
  # --- payments -----------------------------------------------------------
  PAYMENT_MODE: "mock"
  NETWORK: "mock:local"
  PAY_TO: "0x0000000000000000000000000000000000000402"
  FACILITATOR_URL: "http://facilitator.sandbox-system.svc.cluster.local:3002"
  ALLOW_INSECURE_DEV: "true"

  # --- observability ------------------------------------------------------
  # Private scrape listener on every role. Never routed by the ingress.
  METRICS_PORT: "9100"
  METRICS_HOST: "0.0.0.0"

  # --- api ----------------------------------------------------------------
  PUBLIC_BASE_URL: "http://localhost:8080"
  CAPABILITY_GRACE_SECONDS: "900"
  # Admission control: 30-request burst, 1/s sustained per payer.
  # The per-IP guard is coarser and only bounds unauthenticated abuse.
  CREATE_RATE_BURST: "30"
  CREATE_RATE_REFILL: "1"
  CREATE_IP_RATE_BURST: "120"
  CREATE_IP_RATE_REFILL: "10"
  # 0 keeps req.ip as the socket peer. Set to 1 only when exactly one reverse
  # proxy is the sole path to the API (see docs/runbook 04 in the homelab).
  TRUST_PROXY_HOPS: "0"

  # --- controller ---------------------------------------------------------
  CONTROLLER_URL: "http://controller.sandbox-system.svc.cluster.local:3001"
  # Optional mTLS listener for the API. The plain HTTP port stays for the relay
  # and kubelet probes. Empty/0 disables TLS (kind); the homelab enables it and
  # mounts the certificates.
  CONTROLLER_TLS_PORT: "0"
  TLS_CERT_FILE: ""
  TLS_KEY_FILE: ""
  TLS_CA_FILE: ""
  # Client side (API -> controller). Set all three together.
  CONTROLLER_TLS_CERT_FILE: ""
  CONTROLLER_TLS_KEY_FILE: ""
  CONTROLLER_TLS_CA_FILE: ""
  # Controller -> relay control path is mTLS. The relay listens on 8444 with a
  # client CA and requires CN=controller; the guest WebSocket stays on 8443.
  # The homelab mounts these from its own Secret; kind generates them.
  RELAY_URL: "https://relay.sandbox-system.svc.cluster.local:8444"
  RELAY_CONTROL_PORT: "8444"
  # Relay listener identity (server cert/key + client CA).
  RELAY_TLS_CERT_FILE: "/tls/tls.crt"
  RELAY_TLS_KEY_FILE: "/tls/tls.key"
  RELAY_TLS_CA_FILE: "/tls/ca.crt"
  # Controller client identity for the relay control listener.
  RELAY_CLIENT_TLS_CERT_FILE: "/relay-tls/tls.crt"
  RELAY_CLIENT_TLS_KEY_FILE: "/relay-tls/tls.key"
  RELAY_CLIENT_TLS_CA_FILE: "/relay-tls/ca.crt"
  RELAY_SERVICE_NAME: "relay"
  PROXY_SERVICE_NAME: "egress-proxy"
  # Data-plane placement. Both default to 1, which keeps the ClusterIP Service
  # path (byte-identical pod endpoints). Raising either to match its
  # StatefulSet's replicas makes the relay/proxy reject a connection routed to
  # the wrong shard, and changes what a guest dials: with
  # RELAY_GUEST_ADDRESS=service (the default) the relay is that shard's
  # `relay-<n>` ClusterIP, while the proxy stays an endpoint Pod IP. A proxy
  # replacement therefore still breaks egress for the rest of a session.
  # The warm pool resolves the relay the same way. If it did not, warm and cold
  # guests would dial different addresses on the same cluster.
  # Update these and the StatefulSet replicas in 12-relay.yaml / 13-egress-proxy.yaml
  # in the same change; a mismatch silently reintroduces per-replica state, and
  # scripts/check-singletons.mjs fails when the relay count and the StatefulSet
  # disagree.
  #
  # Relay is 2. That is blast radius, not capacity or HA: each shard holds a
  # disjoint half of the sessions, so a single relay pod restart interrupts
  # roughly half of them instead of all. A full rollout still replaces both pods,
  # one ordinal at a time, so each half is interrupted in turn rather than both
  # at once. Both pods are pinned to the single control-plane node by the
  # StatefulSet nodeSelector, so losing that node still takes down Postgres, the
  # controller and the API with the relay. Egress-proxy stays at 1: a proxy
  # restart breaks egress for the rest of a session but does not end it
  # (ADR 0012).
  #
  # Raising RELAY_REPLICAS also requires the relay server certificate (the
  # relay-tls Secret, managed outside this repo) to carry
  # relay-<n>.relay-headless SANs for every shard: the controller's admin calls
  # reach each shard by that name over mTLS. scripts/dev-secrets.sh issues
  # relay-0..9 for a local cluster.
  RELAY_REPLICAS: "2"
  PROXY_REPLICAS: "1"
  RELAY_HOST_TEMPLATE: "relay-{shard}.relay-headless"
  PROXY_HOST_TEMPLATE: "egress-proxy-{shard}.egress-proxy-headless"
  # Backups are not this process's job any more. The controller never copies
  # the database; logical/physical backups, PITR, encryption and retention
  # belong to the Postgres layer. See docs/backup-restore.md.
  SANDBOX_NAMESPACE: "sandbox-workloads"
  CONTROL_NAMESPACE: "sandbox-system"

  # --- execution environment ---------------------------------------------
  # DEV: ordinary containers. See docs/security-guarantees.md.
  EXECUTION_MODE: "dev"
  RUNTIME_CLASS: "x402-sandbox"
  GUEST_IMAGE: "x402-sandbox/guest:dev"
  # The dev placeholder is only valid for the local process provisioner. A
  # Kubernetes deployment must pin a real sha256 digest; deploy/kind/apply.sh
  # rewrites this to the digest of the locally loaded image.
  GUEST_IMAGE_DIGEST: "sha256:dev-unpinned-image"
  # StorageClass for checkpointed (suspendable) session workspaces.
  # `standard` is local-path on the homelab: the checkpoint is plaintext and
  # the node/storage admin can read it. See docs/adr/0007.
  WORKSPACE_STORAGE_CLASS: "standard"
  # Delete a workspace PVC that no session owns once it is this old. This is
  # the backstop for a lost session row (for example after a database restore);
  # the normal path deletes the PVC during termination.
  ORPHAN_PVC_GRACE_MS: "3600000"
  PROVISIONING_TIMEOUT_MS: "90000"
  LEASE_GRACE_MS: "2000"
  # 0 = unlimited. In production cap cold provisioning so a burst cannot
  # stampede the kubelet; the excess stays PAID and retries each tick.
  MAX_CONCURRENT_PROVISIONING: "0"
  PROVISION_QUEUE_TIMEOUT_MS: "120000"
  # Durable create budget (#48), enforced in the controller. The in-memory API
  # buckets are the burst smoother; these are the ceiling that survives a
  # restart and a rotated payer key. Defaults shown.
  BUDGET_WINDOW_MS: "3600000"
  PAYER_CREATES_PER_WINDOW: "60"
  PAYER_SPEND_PER_WINDOW: "50000000"
  PAYER_CONCURRENT_SESSIONS: "4"
  GLOBAL_CREATES_PER_WINDOW: "2000"
  GLOBAL_CONCURRENT_SESSIONS: "200"
  # Server-issued single-use challenge nonce (#47).
  CHALLENGE_NONCE_TTL_MS: "180000"
  CHALLENGE_NONCE_MAX_ACTIVE: "20000"
  # Settlement reconciliation and refunds (#31). PAYMENT_MODE and FACILITATOR_URL
  # are above. Empty REFUND_WEBHOOK_URL leaves real-mode refunds REFUND_PENDING
  # for an operator: this process holds no signing authority.
  SETTLEMENT_RECOVERY_ENABLED: "true"
  SETTLEMENT_RECOVERY_GRACE_MS: "300000"
  REFUND_MAX_ATTEMPTS: "10"
  REFUND_RETRY_BASE_MS: "60000"
  # REFUND_WEBHOOK_URL: "https://refunds.example.internal/x402"
  # Pre-booted, unleased sandboxes. 0 = off. The pool is sized by cgroup/disk
  # limits, so only sessions at or below the pool tier can claim a pod.
  #
  # One pool per runtime profile shares that budget. `base` is the guest image
  # above and keeps WARM_POOL_BASE_MIN pods; any other profile starts at zero
  # and grows after a claim misses it.
  WARM_POOL_SIZE: "0"
  # WARM_POOL_BASE_MIN: "0"   # defaults to WARM_POOL_SIZE
  # WARM_POOL_COOLDOWN_MS: "15000"
  # WARM_POOL_IDLE_DRAIN_MS: "60000"
  # Optional extra runtime profiles. Each image is pulled by its own pinned
  # digest and must not list `base`.
  # RUNTIME_PROFILES: '{"python":{"image":"ghcr.io/example/guest:0.1.23-python","digest":"sha256:<64 hex>"}}'
  WARM_POOL_TIER: "short"
  WARM_POOL_TTL_MS: "300000"
  WARM_CLAIM_TIMEOUT_MS: "8000"
  MAX_LEASE_SECONDS: "1800"
  ALLOW_CUSTOM_DURATIONS: "true"
  # Custom requests are capped at the largest published tier ("long": 2 CPU /
  # 4 GiB). A 4 CPU / 8 GiB request would take most of a node with 7.5 CPU and
  # ~13 GiB allocatable, which is an eviction, not a fair share.
  MAX_CPU_MILLIS: "2000"
  MAX_MEMORY_MIB: "4096"
  MAX_DISK_MIB: "8192"
  MAX_COMMAND_SECONDS: "300"
  MAX_OUTPUT_BYTES: "262144"
  MAX_FILE_BYTES: "8388608"

  # --- egress proxy -------------------------------------------------------
  EGRESS_ALLOWED_PORTS: "443"
  # Sandbox cluster CIDRs and node networks are denied even if they resolve.
  EGRESS_DENIED_CIDRS: "10.244.0.0/16,10.96.0.0/12,172.20.0.0/16,169.254.0.0/16"
