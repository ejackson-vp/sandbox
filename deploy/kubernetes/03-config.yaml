apiVersion: v1
kind: ConfigMap
metadata:
  name: control-config
  namespace: sandbox-system
data:
  # --- payments -----------------------------------------------------------
  PAYMENT_MODE: "mock"
  NETWORK: "mock:local"
  PAY_TO: "0x0000000000000000000000000000000000000402"
  FACILITATOR_URL: "http://facilitator.sandbox-system.svc.cluster.local:3002"
  ALLOW_INSECURE_DEV: "true"

  # --- observability ------------------------------------------------------
  # Private scrape listener on every role. Never routed by the ingress.
  METRICS_PORT: "9100"
  METRICS_HOST: "0.0.0.0"

  # --- api ----------------------------------------------------------------
  PUBLIC_BASE_URL: "http://localhost:8080"
  CAPABILITY_GRACE_SECONDS: "900"
  # Admission control: 30-request burst, 1/s sustained per payer.
  # The per-IP guard is coarser and only bounds unauthenticated abuse.
  CREATE_RATE_BURST: "30"
  CREATE_RATE_REFILL: "1"
  CREATE_IP_RATE_BURST: "120"
  CREATE_IP_RATE_REFILL: "10"
  # 0 keeps req.ip as the socket peer. Set to 1 only when exactly one reverse
  # proxy is the sole path to the API (see docs/runbook 04 in the homelab).
  TRUST_PROXY_HOPS: "0"

  # --- controller ---------------------------------------------------------
  CONTROLLER_URL: "http://controller.sandbox-system.svc.cluster.local:3001"
  # Optional mTLS listener for the API. The plain HTTP port stays for the relay
  # and kubelet probes. Empty/0 disables TLS (kind); the homelab enables it and
  # mounts the certificates.
  CONTROLLER_TLS_PORT: "0"
  TLS_CERT_FILE: ""
  TLS_KEY_FILE: ""
  TLS_CA_FILE: ""
  # Client side (API -> controller). Set all three together.
  CONTROLLER_TLS_CERT_FILE: ""
  CONTROLLER_TLS_KEY_FILE: ""
  CONTROLLER_TLS_CA_FILE: ""
  # Controller -> relay control path is mTLS. The relay listens on 8444 with a
  # client CA and requires CN=controller; the guest WebSocket stays on 8443.
  # The homelab mounts these from its own Secret; kind generates them.
  RELAY_URL: "https://relay.sandbox-system.svc.cluster.local:8444"
  RELAY_CONTROL_PORT: "8444"
  # Relay listener identity (server cert/key + client CA).
  RELAY_TLS_CERT_FILE: "/tls/tls.crt"
  RELAY_TLS_KEY_FILE: "/tls/tls.key"
  RELAY_TLS_CA_FILE: "/tls/ca.crt"
  # Controller client identity for the relay control listener.
  RELAY_CLIENT_TLS_CERT_FILE: "/relay-tls/tls.crt"
  RELAY_CLIENT_TLS_KEY_FILE: "/relay-tls/tls.key"
  RELAY_CLIENT_TLS_CA_FILE: "/relay-tls/ca.crt"
  RELAY_SERVICE_NAME: "relay"
  PROXY_SERVICE_NAME: "egress-proxy"
  # Automated SQLite backups. Empty BACKUP_DIR disables them. To enable, set
  # BACKUP_DIR=/backups and add backup-encryption-key to x402-secrets.
  # See docs/backup-restore.md.
  BACKUP_DIR: ""
  BACKUP_INTERVAL_MS: "21600000"
  BACKUP_RETENTION: "14"
  SANDBOX_NAMESPACE: "sandbox-workloads"
  CONTROL_NAMESPACE: "sandbox-system"

  # --- execution environment ---------------------------------------------
  # DEV: ordinary containers. See docs/security-guarantees.md.
  EXECUTION_MODE: "dev"
  RUNTIME_CLASS: "x402-sandbox"
  GUEST_IMAGE: "x402-sandbox/guest:dev"
  # The dev placeholder is only valid for the local process provisioner. A
  # Kubernetes deployment must pin a real sha256 digest; deploy/kind/apply.sh
  # rewrites this to the digest of the locally loaded image.
  GUEST_IMAGE_DIGEST: "sha256:dev-unpinned-image"
  # StorageClass for checkpointed (suspendable) session workspaces.
  # `standard` is local-path on the homelab: the checkpoint is plaintext and
  # the node/storage admin can read it. See docs/adr/0007.
  WORKSPACE_STORAGE_CLASS: "standard"
  # Delete a workspace PVC that no session owns once it is this old. This is
  # the backstop for a lost session row (for example after a database restore);
  # the normal path deletes the PVC during termination.
  ORPHAN_PVC_GRACE_MS: "3600000"
  PROVISIONING_TIMEOUT_MS: "90000"
  LEASE_GRACE_MS: "2000"
  # 0 = unlimited. In production cap cold provisioning so a burst cannot
  # stampede the kubelet; the excess stays PAID and retries each tick.
  MAX_CONCURRENT_PROVISIONING: "0"
  PROVISION_QUEUE_TIMEOUT_MS: "120000"
  # Pre-booted, unleased sandboxes. 0 = off. The pool is sized by cgroup/disk
  # limits, so only sessions at or below the pool tier can claim a pod.
  WARM_POOL_SIZE: "0"
  WARM_POOL_TIER: "short"
  WARM_POOL_TTL_MS: "300000"
  WARM_CLAIM_TIMEOUT_MS: "8000"
  MAX_LEASE_SECONDS: "1800"
  ALLOW_CUSTOM_DURATIONS: "true"
  # Custom requests are capped at the largest published tier ("long": 2 CPU /
  # 4 GiB). A 4 CPU / 8 GiB request would take most of a node with 7.5 CPU and
  # ~13 GiB allocatable, which is an eviction, not a fair share.
  MAX_CPU_MILLIS: "2000"
  MAX_MEMORY_MIB: "4096"
  MAX_DISK_MIB: "8192"
  MAX_COMMAND_SECONDS: "300"
  MAX_OUTPUT_BYTES: "262144"
  MAX_FILE_BYTES: "8388608"

  # --- egress proxy -------------------------------------------------------
  EGRESS_ALLOWED_PORTS: "443"
  # Sandbox cluster CIDRs and node networks are denied even if they resolve.
  EGRESS_DENIED_CIDRS: "10.244.0.0/16,10.96.0.0/12,172.20.0.0/16,169.254.0.0/16"
