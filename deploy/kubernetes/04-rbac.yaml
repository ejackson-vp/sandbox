---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: sandbox-system
automountServiceAccountToken: true
---
# The controller may only manage Pods in the sandbox namespace and read
# Services in its own namespace. It cannot read Secrets, exec into pods, or
# touch any other resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: sandbox-workloads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # Checkpointed sessions keep a per-session workspace PVC.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller
  namespace: sandbox-workloads
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller-services
  namespace: sandbox-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # Resolve a Service to a ready endpoint address. A Kata sandbox runs its own
  # kernel, so Cilium's service translation never sees its packets and a
  # ClusterIP is unreachable from inside the microVM.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller-services
  namespace: sandbox-system
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller-services
---
# Read-only node status: a checkpoint on a local-path PVC must fail fast when
# its node is gone, instead of leaving the resume pod Pending for 90 seconds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-controller-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-controller-nodes
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-controller-nodes
