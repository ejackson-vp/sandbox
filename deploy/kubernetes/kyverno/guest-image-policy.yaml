# Admission control for the guest image (#30).
#
# The controller already refuses to start with an unpinned guest image when
# KUBERNETES_ENABLED=true and pulls `repo@sha256:…` whenever a digest is
# configured (controller/src/runtime-profiles.ts). That protects against a moved
# tag; it does not protect against the controller itself being pointed at a
# different image. This policy is the second, independent check: the API server
# rejects a guest pod whose image is not a digest reference in the pinned
# repository, or whose digest is not the released one.
#
# Kyverno is not installed by deploy/kind/up.sh and is not part of
# deploy/kubernetes/kustomization.yaml, so this file is inert until an operator
# applies it. See README.md beside this file for the install and the local-kind
# exception.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sandbox-guest-image-pinned
  annotations:
    policies.kyverno.io/title: Sandbox guest images are pinned by digest
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: "1.11"
    policies.kyverno.io/description: >-
      A sandbox guest pod must run an image reference of the form
      <repository>@sha256:<64 hex>. A tag, a foreign repository, or a digest that
      is not on the released allowlist is rejected. Both rules read their scope
      from the namespace label x402.io/image-policy, which
      deploy/kubernetes/00-namespaces.yaml sets to "enforce" on
      sandbox-workloads.
spec:
  # Enforce: the API server rejects the pod. Audit would only record it, and the
  # point of the control is that a non-conforming pod never starts.
  validationFailureAction: Enforce
  # Report non-conforming pods that already exist (an operator rollout, a
  # bypassed apply) as PolicyReports on the next background scan.
  background: true
  rules:
    # ---------------------------------------------------------------- #
    # 1. The reference is repository@sha256:<64 hex>.                   #
    # ---------------------------------------------------------------- #
    # This rule runs for "enforce" and for the documented local-kind
    # "dev-unpinned" mode: the digest shape is never relaxed, only the
    # allowlist below is.
    - name: guest-image-digest-reference
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchExpressions:
                  - key: x402.io/image-policy
                    operator: In
                    values: ["enforce", "dev-unpinned"]
      validate:
        message: >-
          sandbox guest pods must run <repository>@sha256:<64 hex>: the
          repositories are x402-sandbox/guest (local builds) and
          ghcr.io/ejackson-vp/sandbox-guest (releases). A tag-only reference
          (":dev", ":latest", ":0.1.25") or a different repository is rejected
          because it can be repointed after review.
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotMatches
                    value: "^(x402-sandbox/guest|ghcr\\.io/ejackson-vp/sandbox-guest)@sha256:[0-9a-f]{64}$"

    # ---------------------------------------------------------------- #
    # 2. The digest is the released one.                                #
    # ---------------------------------------------------------------- #
    # Update this list in the same change as GUEST_IMAGE_DIGEST /
    # RUNTIME_PROFILES in deploy/kubernetes/03-config.yaml. A missing entry is
    # a rejected pod, not a silently unpinned one.
    #
    # The local-kind exception is the namespace label above: a kind build has a
    # machine-specific digest (deploy/kind/apply.sh reads it out of containerd),
    # so it can never appear in a committed allowlist. Relabelling to
    # "dev-unpinned" keeps rule 1 and drops only this rule.
    - name: guest-image-allowlisted-digest
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchLabels:
                  x402.io/image-policy: enforce
      validate:
        message: >-
          this guest image digest is not the released one. Deploy the digest in
          deploy/kubernetes/03-config.yaml (GUEST_IMAGE_DIGEST and
          RUNTIME_PROFILES) and add it here in the same change. On a local kind
          cluster, label the namespace x402.io/image-policy=dev-unpinned instead
          (deploy/kubernetes/kyverno/README.md).
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotIn
                    value:
                      # base image, GUEST_IMAGE_DIGEST
                      - "ghcr.io/ejackson-vp/sandbox-guest@sha256:REPLACE_WITH_RELEASED_BASE_DIGEST"
                      # python profile, RUNTIME_PROFILES.python.digest
                      - "ghcr.io/ejackson-vp/sandbox-guest@sha256:REPLACE_WITH_RELEASED_PYTHON_DIGEST"
                      # node profile, RUNTIME_PROFILES.node.digest
                      - "ghcr.io/ejackson-vp/sandbox-guest@sha256:REPLACE_WITH_RELEASED_NODE_DIGEST"
