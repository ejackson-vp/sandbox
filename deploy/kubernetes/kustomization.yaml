apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - 01-runtimeclass.yaml
  - 03-config.yaml
  - 04-rbac.yaml
  # Postgres comes before the workloads that dial it, so `kubectl kustomize`
  # renders (and `apply.sh` applies) the Service and StatefulSet first.
  - 05-postgres.yaml
  - 10-api.yaml
  - 11-controller.yaml
  - 12-relay.yaml
  - 13-egress-proxy.yaml
  - 14-facilitator.yaml
  - 20-networkpolicy-sandbox.yaml
  - 21-networkpolicy-control.yaml
