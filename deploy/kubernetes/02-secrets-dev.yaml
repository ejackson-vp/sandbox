# DEV-ONLY credentials.
#
# These values are committed on purpose so `make demo` works on a fresh
# machine. They provide no security. Replace every value (and remove the dev
# attestation key) before running anywhere that matters.
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: sandbox-system
type: Opaque
stringData:
  admin-token: "dev-admin-token-INSECURE-DEV-ONLY-0123456789"
  relay-admin-token: "dev-relay-token-INSECURE-DEV-ONLY-0123456789"
  proxy-token-secret: "dev-proxy-secret-INSECURE-DEV-ONLY-0123456789"
  # Ed25519 seed (32 bytes, base64) for simulated attestation. The matching
  # public key is pinned in shared/src/dev-attestation.ts.
  dev-attestation-key: "qSgP+dPwGhb/58O0ZD/dSqCMovhhWNIQbT3MeTD35WY="
  dev-attestation-key-id: "x402-dev-attestation-key-INSECURE-DEV-ONLY"
