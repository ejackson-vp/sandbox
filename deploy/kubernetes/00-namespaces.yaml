apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-system
  labels:
    app.kubernetes.io/part-of: x402-confidential-sandbox
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-workloads
  labels:
    app.kubernetes.io/part-of: x402-confidential-sandbox
    x402.io/role: sandbox-workloads
    # No customer workload may escape the restricted profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
