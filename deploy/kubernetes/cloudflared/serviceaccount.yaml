# No API access at all: the tunnel is a client to Cloudflare's edge and a client
# to the API Service, nothing else. A separate ServiceAccount keeps it out of the
# controller's and the API's identity, and the token is never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: sandbox-system
  labels: {app: cloudflared}
automountServiceAccountToken: false
