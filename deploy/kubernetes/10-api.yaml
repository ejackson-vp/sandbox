apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sandbox-system
  labels: {app: api}
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sandbox-system
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: x402-sandbox/control:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "api/dist/main.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: control-config}
          env:
            - {name: PORT, value: "3000"}
            - {name: SERVICE_NAME, value: "api"}
            - name: CONTROLLER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: x402-secrets, key: admin-token}
            - name: CAPABILITY_SECRET
              valueFrom:
                secretKeyRef: {name: x402-secrets, key: capability-secret}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi", ephemeral-storage: "64Mi"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: "64Mi"}
