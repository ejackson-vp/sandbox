apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sandbox-system
  labels: {app: api}
spec:
  # ClusterIP only. External access is the Tailscale Ingress, which terminates
  # TLS on a *.ts.net certificate; local development uses a port-forward (or the
  # kind patch in deploy/kind/apply.sh). A NodePort here would publish an
  # unauthenticated, plaintext API on every node's LAN address for no benefit.
  type: ClusterIP
  selector: {app: api}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sandbox-system
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: x402-sandbox/control:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "api/dist/main.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: control-config}
          env:
            - {name: PORT, value: "3000"}
            - {name: SERVICE_NAME, value: "api"}
            - name: CONTROLLER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: x402-secrets, key: admin-token}
            - name: CAPABILITY_SECRET
              valueFrom:
                secretKeyRef: {name: x402-secrets, key: capability-secret}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi", ephemeral-storage: "64Mi"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /tls, readOnly: true}
          readinessProbe:
            # Controller reachable, and therefore the controller's own store,
            # relay and provisioner checks pass.
            httpGet: {path: /readyz, port: 3000}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Event loop only; a dependency blip must not restart the API.
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: "64Mi"}
        - name: tls
          secret:
            secretName: api-client-tls
            optional: true
            defaultMode: 0444
