apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: sandbox-system
  labels: {app: egress-proxy}
spec:
  selector: {app: egress-proxy}
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: sandbox-system
  labels: {app: egress-proxy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: egress-proxy}
  template:
    metadata:
      labels: {app: egress-proxy}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: egress-proxy
          image: x402-sandbox/control:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "controller/dist/main.js"]
          ports:
            - containerPort: 3128
          envFrom:
            - configMapRef: {name: control-config}
          env:
            - {name: ROLE, value: "proxy"}
            - {name: X402_PROXY_PORT, value: "3128"}
            - {name: SERVICE_NAME, value: "egress-proxy"}
            - name: PROXY_TOKEN_SECRET
              valueFrom:
                secretKeyRef: {name: x402-secrets, key: proxy-token-secret}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi", ephemeral-storage: "64Mi"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: 3128}
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: "32Mi"}
