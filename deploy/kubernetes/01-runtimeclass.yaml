# Dev-mode RuntimeClass.
#
# The handler is `runc`: this is an ordinary container, NOT a VM and NOT
# confidential. The RuntimeClass is mandatory (the controller always sets
# runtimeClassName) so that switching environments is a one-field change:
#
#   deploy/kata/runtimeclass-patch.yaml          -> handler: kata-qemu
#   deploy/kata/runtimeclass-coco-patch.yaml     -> handler: kata-qemu-coco-dev
#   deploy/confidential/runtimeclass-sev-snp.yaml-> handler: kata-qemu-sev-snp
#
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: x402-sandbox
  annotations:
    x402.io/confidential: "false"
    x402.io/warning: "DEV MODE (runc): no VM, no hardware isolation, no real attestation"
handler: runc
