# Base RuntimeClass — ordinary containers, not a VM.
#
# The RuntimeClass is mandatory: the controller always sets runtimeClassName, so
# changing the isolation level is a one-field change:
#
#   deploy/kata/kustomization.yaml   -> handler: kata  (microVM, own guest kernel)
#   deploy/talos/kustomization.yaml  -> kata + published images (real cluster)
#
# This base is for development and tests only: no VM, no guest kernel, no
# isolation from the host. See docs/security-guarantees.md.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: x402-sandbox
  annotations:
    x402.io/isolation: "shared-kernel"
    x402.io/warning: "DEV MODE (runc): no VM, no guest kernel, no isolation from the host"
handler: runc
