# ---------------------------------------------------------------------------
# Control-plane isolation
# Every control-plane component is default-denied, then opened only for the
# traffic it actually needs. The relay accepts guest connections from the
# sandbox namespace; nothing else is reachable from there.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sandbox-system
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Public API: reachable from the ingress proxy (and any in-cluster caller) on
# 3000. The first rule deliberately has no `from:` — the port is the boundary —
# but sandbox pods still cannot reach it because their egress policy has no rule
# for this namespace.
#
# The second rule is the public path: the cloudflared tunnel
# (deploy/kubernetes/cloudflared) dials the API Service on 3000. It is explicit
# rather than leaning on the port-only rule above, because a deployment that
# scopes that rule to the Tailscale namespace for operator access (the homelab
# does) would otherwise leave the tunnel answering 502. The Tailscale Ingress
# stays in place for operators; it is no longer the public path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels: {app: cloudflared}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3004
    - to:
        - podSelector:
            matchLabels: {app: facilitator}
      ports:
        - protocol: TCP
          port: 3002
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: controller}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        # The relay holds only the low-privilege wake token: a hello nudges the
        # reconciler and cannot reach any other internal endpoint.
        - podSelector:
            matchLabels: {app: relay}
      ports:
        - protocol: TCP
          port: 3001
    # The API also has the mTLS listener. In the homelab the 3001 rule above is
    # narrowed to the relay, so the API can only use the client-certificate path.
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - protocol: TCP
          port: 3004
  egress:
    # Kubernetes API (in-cluster Service IP).
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels: {app: relay}
      ports:
        # mTLS control listener only. The controller never talks to the guest
        # listener; the sandbox namespace owns that path.
        - protocol: TCP
          port: 8444
    # The durable store (05-postgres.yaml). This is the only client the
    # database admits, and the only place the controller's egress policy
    # reaches a data service.
    - to:
        - podSelector:
            matchLabels: {app: postgres}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The store accepts connections and dials nothing. Ingress is the controller on
# 5432 only: the API, relay, proxy and facilitator have no rule that reaches it,
# and sandbox pods cannot either because their egress policy has no route into
# this namespace. Reply traffic on the established connection is stateful and
# needs no egress rule of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
# The relay is the only sandbox-reachable control-plane service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-relay
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: relay}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-workloads
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 8444
  egress:
    # Speculative readiness wake only (POST /internal/wake).
    - to:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 3001
    # Resolve the controller Service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-proxy
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: egress-proxy}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-workloads
      ports:
        - protocol: TCP
          port: 3128
  egress:
    # The proxy itself is the policy enforcement point for destinations.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: sandbox-system
spec:
  # Additive to the per-role policies above: the metrics port is not reachable
  # from the ingress, from sandbox pods, or from other control-plane roles.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        # The proxy is included because it is the only exporter of the egress
        # byte counters. Its metrics port is scraped by pod name, same as the
        # relay, and is reachable from nothing else.
        values: ["api", "controller", "relay", "egress-proxy"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Homelab Prometheus/Grafana live in `monitoring`; either namespace is
        # accepted so the manifest also fits an `observability` deployment.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-facilitator
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: facilitator}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - protocol: TCP
          port: 3002
  egress: []
---
# The public tunnel. It is default-denied by `default-deny-all` like every other
# pod in this namespace, so both directions are stated here: out to Cloudflare's
# edge, out to the API, and no inbound route except the readiness listener the
# kubelet probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: cloudflared}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # The `--metrics` listener only. The tunnel is outbound; Cloudflare does not
    # dial into the cluster. Nothing else has a route here: the sandbox namespace
    # has no egress rule into this namespace, and no other control-plane role
    # selects this pod.
    - ports:
        - protocol: TCP
          port: 2000
  egress:
    # Cloudflare edge. Port 7844 carries both transports: QUIC over UDP and the
    # HTTP/2 fallback over TCP. No other destination is reachable, so a
    # compromised tunnel client cannot be used as a general egress proxy.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
    # The origin.
    - to:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
