# ---------------------------------------------------------------------------
# Control-plane isolation
# Every control-plane component is default-denied, then opened only for the
# traffic it actually needs. The relay accepts guest connections from the
# sandbox namespace; nothing else is reachable from there.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sandbox-system
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Public API: reachable from the ingress proxy (and any in-cluster caller) on
# 3000. The ingress rule below deliberately has no `from:` — the port is the
# boundary — but sandbox pods still cannot reach it because their egress policy
# has no rule for this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3004
    - to:
        - podSelector:
            matchLabels: {app: facilitator}
      ports:
        - protocol: TCP
          port: 3002
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: controller}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        # The relay holds only the low-privilege wake token: a hello nudges the
        # reconciler and cannot reach any other internal endpoint.
        - podSelector:
            matchLabels: {app: relay}
      ports:
        - protocol: TCP
          port: 3001
    # The API also has the mTLS listener. In the homelab the 3001 rule above is
    # narrowed to the relay, so the API can only use the client-certificate path.
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - protocol: TCP
          port: 3004
  egress:
    # Kubernetes API (in-cluster Service IP).
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels: {app: relay}
      ports:
        # mTLS control listener only. The controller never talks to the guest
        # listener; the sandbox namespace owns that path.
        - protocol: TCP
          port: 8444
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The relay is the only sandbox-reachable control-plane service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-relay
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: relay}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-workloads
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 8444
  egress:
    # Speculative readiness wake only (POST /internal/wake).
    - to:
        - podSelector:
            matchLabels: {app: controller}
      ports:
        - protocol: TCP
          port: 3001
    # Resolve the controller Service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-proxy
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: egress-proxy}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox-workloads
      ports:
        - protocol: TCP
          port: 3128
  egress:
    # The proxy itself is the policy enforcement point for destinations.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: sandbox-system
spec:
  # Additive to the per-role policies above: the metrics port is not reachable
  # from the ingress, from sandbox pods, or from other control-plane roles.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["api", "controller", "relay"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Homelab Prometheus/Grafana live in `monitoring`; either namespace is
        # accepted so the manifest also fits an `observability` deployment.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-facilitator
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: facilitator}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - protocol: TCP
          port: 3002
  egress: []
