<!--
  Source for assets/og-card.png (the 1200x630 social preview card).

  Re-render after any change (palette edits, new tagline, new wordmark):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=assets/og-card.png --window-size=1200,630 \
      "file://$PWD/assets/og-card.html"

  Then check it: sips -g pixelWidth -g pixelHeight assets/og-card.png
  (must be exactly 1200x630). Run from site/, i.e. $PWD must contain assets/.
  Self-contained on purpose: system fonts only, inline SVG, no network requests.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>throwbox social card</title>
    <style>
      :root {
        /* lifted verbatim from styles.css so the card matches the site */
        --paper: #f4efe3;
        --card: #fffdf7;
        --ink: #12212a;
        --ink-2: #2d4048;
        --muted: #5d6a6e;
        --line-strong: rgba(18, 33, 42, 0.34);
        --mint: #087f68;
        --mint-ink: #076653;
        --butter: #e6b34a;
        --butter-ink: #8a620d;
        --butter-soft: #f8ecc9;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 1200px;
        height: 630px;
        padding: 80px 92px 62px;
      }

      .kicker {
        margin: 0 0 40px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .kicker b {
        color: var(--mint);
        font-weight: 700;
      }

      .wordmark-row {
        display: flex;
        align-items: baseline;
        gap: 22px;
      }

      .wordmark {
        margin: 0;
        font-size: 174px;
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 0.86;
      }

      .pill {
        padding: 5px 12px 3px;
        border: 1.5px solid color-mix(in srgb, var(--butter) 55%, transparent);
        border-radius: 999px;
        background: var(--butter-soft);
        color: var(--butter-ink);
        font-family: var(--mono);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .tagline {
        margin: 30px 0 0;
        color: var(--mint-ink);
        font-family: var(--mono);
        font-size: 31px;
        letter-spacing: 0.01em;
        line-height: 1.3;
      }

      .perf {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
        padding-top: 34px;
        border-top: 2px dashed var(--line-strong);
      }

      .url {
        margin: 0;
        padding-bottom: 12px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 19px;
        letter-spacing: 0.06em;
      }

      .url span {
        color: var(--ink-2);
      }

      .mark {
        width: 146px;
        height: 146px;
        flex: none;
        fill: none;
        stroke: var(--ink-2);
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .eye {
        fill: var(--mint);
        stroke: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <p class="kicker"><b>[</b> disposable linux · no accounts <b>]</b></p>

        <div class="wordmark-row">
          <p class="wordmark">throwbox</p>
          <span class="pill">beta</span>
        </div>

        <p class="tagline">a Linux box with a very short life</p>
      </div>

      <div class="perf">
        <p class="url"><span>throwbox.dev</span> · pay once, forget everything</p>

        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M17 4 H6 Q4 4 4 6 V17" />
          <path d="M47 4 H58 Q60 4 60 6 V17" />
          <path d="M4 47 V58 Q4 60 6 60 H17" />
          <path d="M60 47 V58 Q60 60 58 60 H47" />
          <rect class="eye" x="25.5" y="25.5" width="13" height="13" rx="3.5" />
        </svg>
      </div>
    </div>
  </body>
</html>
